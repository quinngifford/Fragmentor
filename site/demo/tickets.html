<!doctype html>
<html lang="en">
  <head>

    />
    <title>Tickets</title>
    <style>/* An instrument panel, not a web page. The phosphor green is signal colour:
   it marks what carries data. Everything else stays quiet so it can. */

:root {
  --ground: #07090a;
  --panel: #0d1113;
  --panel-high: #131a1c;
  --rule: #1d2629;
  --rule-bright: #2b3a3e;
  --ink: #c6d5d0;
  --ink-dim: #6b807b;
  --ink-faint: #475855;
  --signal: #4fe38f;
  --signal-dim: #2b8d5c;
  --signal-deep: #1a4b34;
  --effect: #e2a54b;
  /* An execution's steps that carry nothing: a trigger, a call made for its
     own sake. They light up rather than flow, in a colour of their own. */
  --exec-trigger: #9fd3ff;
  --pending: #7a8b96;
  --bad: #e3778c;
  --flag-red: rgb(235, 42, 74);
  /* What kind of thing a block is: set on the document by the renderer, which
     holds the defaults and whatever the person has changed them to. */
  /* Code colours. Quiet enough to sit beside the diagram, and distinct enough
     to be read apart at 11px. None of them is the signal green, which on this
     panel means something else. */
  --code-comment: #52655f;
  --code-keyword: #7aa6d6;
  --code-string: #a8d68f;
  --code-number: #d9a86c;
  --code-type: #7fd1c4;
  --code-name: #d6cf8a;
  --code-punct: #77908a;
  --radius: 3px;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, "SF Mono", Menlo, monospace;
  /* Scrollbars and the browser's own controls are drawn dark to match. A pale
     scrollbar down the side of a code box was the loudest thing on the panel. */
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
  user-select: none;
}

.shell { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }

/* ---- top bar ---- */

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 14px;
  border-bottom: 1px solid var(--rule);
  background: var(--panel);
  -webkit-app-region: drag;
}

.topbar button, .topbar .crumbs { -webkit-app-region: no-drag; }

.mark { padding-right: 14px; border-right: 1px solid var(--rule); }

.mark strong {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--signal);
}

.crumbs { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 12px; }

.crumb {
  background: none;
  border: 0;
  padding: 3px 7px;
  border-radius: var(--radius);
  font: inherit;
  color: var(--ink-dim);
  cursor: pointer;
}

.crumb:hover { color: var(--signal); background: var(--panel-high); }
.crumb[aria-current="true"] { color: var(--ink); background: var(--panel-high); cursor: default; }
.crumb-sep { color: var(--ink-faint); }

.toolbar { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.toolbar-sep { width: 1px; height: 20px; background: var(--rule); margin: 0 4px; }

.toggle, .zoom-btn, .chip {
  font-family: var(--mono);
  font-size: 11.5px;
  padding: 4px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--rule-bright);
  background: none;
  color: var(--ink-dim);
  cursor: pointer;
}

.toggle:hover, .zoom-btn:hover, .chip:hover { color: var(--ink); background: var(--panel-high); }
.toggle[aria-pressed="true"] { color: var(--signal); border-color: var(--signal-dim); }

/* With no project open, Commands is hidden, and the line after it would
   divide nothing from the panel switches. */
#agent-commands[hidden] + .toolbar-sep { display: none; }
.chip[aria-pressed="true"] { color: var(--signal); border-color: var(--signal-dim); background: var(--signal-deep); }

/* ---- panes ---- */

.panes { display: grid; min-height: 0; grid-template-columns: 232px minmax(0, 1fr) 5px 360px; }

.rail, .inspector { background: var(--panel); overflow-y: auto; min-height: 0; }
.rail { border-right: 1px solid var(--rule); }
.inspector { border-left: 1px solid var(--rule); }

/* The handle between the diagram and the inspector. Thin, and lit while it is
   being used, so it reads as an edge rather than a gap. */
.splitter {
  cursor: col-resize;
  background: var(--rule);
  touch-action: none;
}

.splitter:hover, .splitter[data-dragging="true"] { background: var(--signal-dim); }
body[data-resizing="true"] { cursor: col-resize; }

.pane-title {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding: 12px 16px 6px;
}

/* ---- hierarchy ---- */

.tree { padding: 0 8px 20px; display: flex; flex-direction: column; gap: 1px; }

.node {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 5px 8px;
  border: 0;
  border-radius: var(--radius);
  background: none;
  color: var(--ink-dim);
  font-family: var(--mono);
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}

.node:hover { background: var(--panel-high); color: var(--ink); }
.node[aria-selected="true"] { background: var(--signal-deep); color: var(--signal); }
.node .glyph { color: var(--ink-faint); flex: none; width: 11px; text-align: center; }
.node[aria-selected="true"] .glyph { color: var(--signal); }
.node .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- canvas ---- */

.canvas-wrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--ground); }
#canvas-svg { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#canvas-svg.panning { cursor: grabbing; }
#canvas-svg.dragging { cursor: move; }

.canvas-empty {
  position: absolute;
  inset: 26px auto auto 26px;
  color: var(--ink-dim);
  font-size: 13px;
  max-width: 52ch;
  white-space: pre-wrap;
  font-family: var(--mono);
}

/* What to do while the agent has not started: a card laid out as the
   first-steps window is, rather than the plain words of any other message. */
.canvas-empty.waiting-card {
  width: min(560px, calc(100% - 52px));
  max-width: none;
  max-height: calc(100% - 52px);
  overflow-y: auto;
  padding: 22px 24px 18px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  white-space: normal;
  font-family: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  user-select: text;
}
.waiting-card .dialog-lede { margin: -14px 0 0; }

.zoom-bar {
  position: absolute;
  left: 14px;
  bottom: 14px;
  display: flex;
  gap: 4px;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  padding: 4px;
}

/* `display: flex` above would otherwise beat the hidden attribute's own rule. */
.zoom-bar[hidden] { display: none; }

.zoom-btn { border-color: transparent; min-width: 28px; text-align: center; }
.zoom-level { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); min-width: 44px; text-align: center; }
.zoom-divider { width: 1px; align-self: stretch; background: var(--rule-bright); margin: 0 3px; }

/* What the colours on this diagram mean, for as long as they mean anything.
   It sits above the zoom bar, out of the way of the blocks. */
.legend {
  position: absolute;
  left: 14px;
  bottom: 56px;
  max-height: calc(100% - 92px);
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 3px;
  background: var(--panel);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  padding: 7px 9px;
}

/* `display: flex` above would otherwise beat the hidden attribute's own rule. */
.legend[hidden] { display: none; }

/* The heading on the left, the arrow that folds it away on the right. */
.legend-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.legend-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.legend-toggle {
  background: none;
  border: none;
  padding: 0 0 0 4px;
  font-size: 11px;
  line-height: 1;
  color: var(--ink-faint);
  cursor: pointer;
}
.legend-toggle:hover { color: var(--ink-dim); }
.legend[data-collapsed="false"] .legend-head { margin-bottom: 3px; }

.legend-row { display: flex; align-items: center; gap: 7px; }
/* A kind that is not on this diagram is still listed, because the legend is
   where its colour is chosen, but it is kept quiet. */
.legend-row[data-here="false"] { opacity: 0.45; }

/* The swatch is the colour input itself, stripped back to the colour. */
.legend-swatch {
  width: 20px;
  height: 11px;
  padding: 0;
  border: 1px solid var(--rule-bright);
  border-radius: 2px;
  background: var(--role);
  cursor: pointer;
  appearance: none;
  flex: none;
}
.legend-swatch::-webkit-color-swatch-wrapper { padding: 0; }
.legend-swatch::-webkit-color-swatch { border: none; border-radius: 1px; }
.legend-swatch.fixed {
  cursor: default;
  background: repeating-linear-gradient(90deg, var(--pending) 0 5px, transparent 5px 9px);
}
.legend-text { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); letter-spacing: 0.03em; }

.legend-reset {
  margin-top: 4px;
  background: none;
  border: none;
  padding: 0;
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--ink-faint);
  cursor: pointer;
  text-align: left;
}
.legend-reset:hover { color: var(--signal); }

/* Where one block's colour is chosen, when the diagram is coloured that way. */
.block-colour { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.block-colour-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* What sits along the top of the canvas, side by side while there is room and
   wrapping when there is not, so none of it can land on the rest. */
.canvas-top {
  position: absolute;
  top: 12px;
  left: 14px;
  right: 14px;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 8px;
  pointer-events: none;
}

.canvas-top > * { pointer-events: auto; }

.hint {
  margin-left: auto;
  padding-top: 2px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-faint);
  pointer-events: none;
}

/* ---- welcome ---- */

.welcome {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--ground);
  text-align: center;
  padding: 40px;
}

body[data-project="open"] .welcome { display: none; }

/* An exported page: the drawing and the panel beside it, and nothing that
   edits, runs or asks the application for anything. */
body[data-export] :is(#agent-commands, #toggle-rail, #toggle-inspector, .toolbar-sep, #rail, #inspector-splitter,
  #crumbs, #run-bar, #notes-bar, #changes-bar, #panels, .breakpoint) { display: none; }

.welcome h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--signal);
}

.welcome p { margin: 0 0 12px; color: var(--ink-dim); max-width: 48ch; }
.welcome-body { display: flex; flex-direction: column; gap: 18px; align-items: center; }
.welcome-group { display: flex; flex-direction: column; gap: 4px; align-items: stretch; min-width: 340px; }

.welcome-group h3 {
  margin: 0 0 2px;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 500;
  text-align: left;
}

.welcome-link {
  font-family: var(--mono);
  font-size: 11.5px;
  text-align: left;
  padding: 6px 10px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--ink-dim);
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  direction: rtl;
}

.welcome-link:hover { color: var(--signal); border-color: var(--signal-dim); }

/* A mark of its own in the rail for a block that is not code, in the colour
   it is drawn in on the canvas. */
.node[data-architecture="true"] .glyph { color: var(--role); }

.btn.tiny { padding: 1px 6px; font-size: 10px; }
.ptype.bad { color: var(--bad); }

/* ---- blocks ---- */

.block-box { cursor: move; }
.block-plate { fill: var(--panel-high); stroke: var(--rule-bright); stroke-width: 1; }

/* The breakpoint sits beside the block, inside the same group, so anything
   that lights up the whole group would reach out and take the breakpoint in
   with it. Hovering is answered by the plate, and the plate is the part that
   can be focused. */
.block-body:hover .block-plate { stroke: var(--signal-dim); }
.block-plate:focus-visible { outline: none; stroke: var(--signal); stroke-width: 2; }
.block-box[data-selected="true"] .block-plate { stroke: var(--signal); stroke-width: 1.8; }

/* The rest of the system. Hue says which world a thing belongs to, and runs
   from what is most yours to what is least: your code, your separate
   programs, the data you keep, the data in motion, the people you serve, and
   the services you do not control. Green is your own code. Red is not spent
   here; on this panel it means something is wrong.

   These come before the planned rules deliberately: a planned database should
   read as planned first. */
[data-role="function"] { --role: var(--role-function); }
[data-role="component"] { --role: var(--role-component); }
[data-role="service"] { --role: var(--role-service); }
[data-role="external"] { --role: var(--role-external); }
[data-role="database"] { --role: var(--role-database); }
[data-role="storage"] { --role: var(--role-storage); }
[data-role="queue"] { --role: var(--role-queue); }
[data-role="structure"] { --role: var(--role-structure); }
[data-role="client"] { --role: var(--role-client); }

.block-box[data-tinted="true"] .block-plate {
  fill: color-mix(in srgb, var(--role) 5%, var(--panel));
  stroke: color-mix(in srgb, var(--role) 55%, var(--ground));
  stroke-width: 1.6;
}
.block-box[data-tinted="true"] .block-kind { fill: var(--role); }
.block-box[data-tinted="true"] .block-body:hover .block-plate { stroke: var(--role); }

/* An access takes the colour of whatever it reaches, so a line and the block
   at the end of it are plainly the same subject. Solid, because dashed on
   this canvas means not built yet and nothing else. */
.access { fill: none; stroke: var(--role); stroke-width: 1.6; opacity: 0.6; }
/* The arrowhead takes the line's own colour rather than one of its own. */
.access-arrow { fill: context-stroke; }
.access-group:hover .access { opacity: 1; stroke-width: 2.6; }
.access-group[data-selected="true"] .access { opacity: 1; stroke-width: 3; }
.access-label { font-family: var(--mono); font-size: 9px; fill: var(--role); opacity: 0.85; pointer-events: none; }

/* A relationship that was already there, rather than a value on its way, so
   it appears rather than being drawn along its length. */
.access-group.appearing { animation: fade-in 500ms ease-out backwards; }

/* Nothing about a plan is settled, including what runs between its blocks. */
.access-group[data-planned="true"] { --role: var(--pending); }
.access-group[data-planned="true"] .access { stroke-dasharray: 6 5; opacity: 0.3; }
.access-group[data-planned="true"] .access-label { opacity: 0.55; }

/* Planned: drawn, not built. It has to read as a block of the same kind as
   the others and still be unmistakably not one of them, so it keeps its shape
   and loses its solidity — a dashed edge, a flat plate, quiet lettering. */
.block-box[data-planned="true"] { --role: var(--pending); }
.block-box[data-planned="true"] .block-plate {
  fill: var(--ground);
  stroke: var(--rule-bright);
  stroke-dasharray: 5 4;
}
.block-box[data-planned="true"] .block-name { fill: var(--ink-dim); }
.block-box[data-planned="true"] .block-kind { fill: var(--pending); }

/* The mark in the corner saying what kind of block this is. Strokes only, so
   it takes whatever colour the block is drawn in. */
.role-icon-line { fill: none; stroke: var(--role, var(--ink-faint)); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
.role-icon { opacity: 0.75; }
.block-body:hover .role-icon { opacity: 1; }
.block-box[data-planned="true"] .role-icon { opacity: 0.5; }

.block-name { font-family: var(--sans); font-size: 12.5px; font-weight: 600; fill: var(--ink); pointer-events: none; }
.block-kind { font-family: var(--mono); font-size: 9px; fill: var(--ink-faint); letter-spacing: 0.08em; pointer-events: none; }

.line-hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }

/* ---- inspector ---- */

/* More room between two sections than a section leaves between its own parts,
   so the gaps agree with the headings about what contains what. */
.inspector-body { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 20px; user-select: text; }

.insp-head { display: flex; flex-direction: column; gap: 6px; }
.insp-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.insp-id { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); word-break: break-all; }

.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

.badge {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 2px;
  border: 1px solid var(--rule-bright);
  color: var(--ink-dim);
}

.badge.state { border-color: #3d4a52; color: var(--pending); }
.badge.state.planned { border-color: var(--rule-bright); color: var(--ink-faint); border-style: dashed; }
.badge.role { border-color: color-mix(in srgb, var(--role) 45%, var(--ground)); color: var(--role); }


.responsibility { margin: 0; font-size: 13px; color: var(--ink); }

/* What kind of thing a block stands for. Quiet: it explains, it does not warn. */
.role-note { margin: 0; font-size: 12px; color: var(--ink-dim); }
.role-note-kind { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; color: var(--role); }

.planned-note {
  margin: 8px 0 0;
  padding: 8px 10px;
  font-size: 12px;
  color: var(--ink-dim);
  border: 1px dashed var(--rule-bright);
  border-radius: var(--radius);
  background: var(--panel);
}

/* The panel reads as three rungs and no more: the subject, the sections it is
   divided into, and the named parts of a section. Each step inwards is set
   further in than the last, so what sits under what is a matter of where it
   starts on the page rather than of how loud its lettering is.
       SECTION ──────────────      flush left, lit bar, rule to the edge
         Part                      indented, quiet, no rule
           name                    indented again, on a spine of its own
             shape                                                          */

/* The heading hangs out to the left of everything under it, which is what
   makes the indent read as containment rather than as a margin. */
.section { display: flex; flex-direction: column; gap: 9px; padding-left: 13px; }

.section > h4, .dialog-field > legend {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 0 -13px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink);
}

/* A short bar in signal colour marks where a section starts, and a rule runs
   from its title to the edge of the panel. Only this rung is marked this way:
   one kind of heading, drawn once. */
.section > h4::before, .dialog-field > legend::before {
  content: "";
  width: 3px;
  height: 12px;
  border-radius: 1px;
  background: var(--signal-dim);
  flex: none;
}

.section > h4::after, .dialog-field > legend::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--rule-bright);
}

/* A named part of a section: a kind of port, a table, one value in a run. Its
   heading is plainly quieter, and what it holds is indented again. */
.subsection {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-left: 11px;
}

.subsection h5 {
  margin: 0 0 1px -11px;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--ink-dim);
}

.subsection h5.good { color: var(--signal); }
.subsection h5.bad { color: var(--bad); }

.ports { display: flex; flex-direction: column; gap: 9px; }

.port-row { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; border-left: 2px solid var(--signal-deep); }
.port-row.cap { border-left-color: var(--effect); }

/* A shape, with the word that says which way it goes kept out of its light. */
.pshape { display: flex; align-items: baseline; gap: 6px; }
/* Without this a long shape refuses to shrink and runs off the panel. */
.pshape .ptype { min-width: 0; }

/* What a row reaches, with the way to it beside it rather than under it. */
.pwhere { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

/* Where pressing this entry leads, on the entry's own row. */
.proute { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

/* Fragmentor's own word in front of the author's: `in`, `out`, `runs`,
   `each row`. Quiet, so the thing it labels is what is read. */
.pshape-label,
.proute-label {
  flex: none;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.proute-text { font-family: var(--mono); font-size: 11px; color: var(--exec-trigger); min-width: 0; word-break: break-word; }

/* One way into the bench: the button, and what pressing it does. */
.run-way { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.run-way .btn { width: fit-content; }
/* A name, a shape and a line about it. Not scoped to a row: the bench names a
   store and its shape the same way, outside any row, and scoped these three
   inherited the body's 14px and came out louder than the heading above them. */
.pname { font-family: var(--mono); font-size: 12px; color: var(--ink); }
/* A shape is coloured token by token, so this is only what is left over: the
   words in a type written in prose, and the plain text of a row that names a
   resource rather than a shape. */
.ptype { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); word-break: break-word; }
.pdesc { font-size: 11.5px; color: var(--ink-dim); }

.btn {
  font: inherit;
  font-size: 12px;
  padding: 7px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--signal-dim);
  background: var(--signal-deep);
  color: var(--signal);
  cursor: pointer;
}

.btn:hover { background: var(--signal-dim); color: var(--ground); }
.btn[disabled] { border-color: var(--rule-bright); background: transparent; color: var(--ink-faint); cursor: not-allowed; }
.btn.quiet { border-color: var(--rule-bright); background: transparent; color: var(--ink-dim); }
.btn.quiet:hover { color: var(--ink); background: var(--panel-high); }

pre.code {
  margin: 0;
  padding: 10px;
  background: var(--ground);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.6;
  color: var(--ink);
  overflow-x: auto;
  white-space: pre;
}

.code-tabs { display: flex; gap: 4px; }

.t-comment { color: var(--code-comment); font-style: italic; }
.t-keyword { color: var(--code-keyword); }
.t-string { color: var(--code-string); }
.t-number { color: var(--code-number); }
.t-type { color: var(--code-type); }
.t-name { color: var(--code-name); }
.t-punct { color: var(--code-punct); }
/* The name of a field, in a shape or in JSON. It takes the colour a name
   takes in code rather than a type's, because in a shape the two sit next to
   each other on every line and would otherwise be one colour. */
.t-key { color: var(--code-name); }

pre.code-view { max-height: 420px; overflow: auto; }

/*
 * A code box that can be typed in and is still coloured.
 *
 * The coloured copy and the box itself sit in the same grid cell, in the same
 * font at the same size, so the text lines up character for character. The box
 * shows nothing but its caret and its selection; everything read is the copy
 * underneath. The box is the one that scrolls and the one that can be resized,
 * and the copy is told to follow it.
 */
.code-edit { position: relative; }

.code-edit-view,
.code-edit-input {
  margin: 0;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.6;
  padding: 10px;
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  white-space: pre;
  overflow-wrap: normal;
  tab-size: 2;
}

/* Taken out of the flow, so the box is the one that decides how tall this is
   and the copy simply fills it. Left in the flow, the copy would be as tall as
   the whole file and the box would be stretched to match it. */
.code-edit-view {
  position: absolute;
  inset: 0;
  background: var(--ground);
  color: var(--ink);
  overflow: hidden;
  pointer-events: none;
  /* The box has a scrollbar and the copy does not, so both keep room for one
     or the coloured text would run a scrollbar's width past the box's. */
  scrollbar-gutter: stable;
}

.code-edit-input {
  display: block;
  width: 100%;
  min-height: 260px;
  height: 260px;
  resize: vertical;
  background: transparent;
  color: transparent;
  caret-color: var(--signal);
  overflow: auto;
  scrollbar-gutter: stable;
}

.code-edit-input::selection { background: rgba(79, 227, 143, 0.22); color: transparent; }
.code-edit-input:focus-visible { outline: 1px solid var(--signal-dim); outline-offset: 0; }
.code-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.swatches { display: flex; gap: 6px; flex-wrap: wrap; }

.bench-note { font-size: 11.5px; color: var(--ink-dim); margin: 0; }
.bench-note.bad { color: var(--bad); }

.field { display: flex; flex-direction: column; gap: 4px; }
.field > label { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }

.field input, .field select, .field textarea {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--ground);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  color: var(--ink);
  padding: 6px 8px;
  width: 100%;
}

/* Tall enough that a few rows of JSON are readable without dragging it first,
   which is what a box two lines high made necessary every time. */
.field textarea { min-height: 96px; resize: vertical; }
.field input[type="checkbox"] { width: auto; accent-color: var(--signal); }
.subfields { display: flex; flex-direction: column; gap: 8px; padding-left: 10px; border-left: 1px solid var(--rule); }

/* ---- status ---- */

.status {
  display: flex;
  gap: 20px;
  align-items: center;
  padding: 7px 14px;
  border-top: 1px solid var(--rule);
  background: var(--panel);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-dim);
  white-space: nowrap;
  overflow: hidden;
}

.status b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.status .project-name { color: var(--signal); }
.status .warn b { color: var(--pending); }
.status .bad b { color: var(--bad); }
.status .good b { color: var(--signal); }
.status .message { overflow: hidden; text-overflow: ellipsis; }
.status .message.good { color: var(--signal); }
.status .message.bad { color: var(--bad); }

:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

/* ---- motion ---- */

/* While the canvas moves between diagrams, nothing on it can be clicked. */
#canvas-svg.moving #viewport { pointer-events: none; }

/* A block the agent has just added grows into place, its outline lit for a
   moment so the eye finds it. */
.block-body.appearing {
  transform-box: fill-box;
  transform-origin: center;
  animation: block-arrive 560ms cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}

.block-body.appearing .block-plate { animation: plate-lit 1800ms ease-out backwards; animation-delay: inherit; }

@keyframes block-arrive {
  from { opacity: 0; transform: scale(0.82); }
  60% { opacity: 1; }
  to { opacity: 1; transform: scale(1); }
}

/* A glow rather than a change of outline: an outline drawn in a mix of the
   block's colour cannot be animated towards without Chromium passing through
   colours that are nothing like either end. */
@keyframes plate-lit {
  from, 30% { filter: drop-shadow(0 0 4px var(--signal)); stroke-width: 2; }
}

@keyframes fade-in {
  from { opacity: 0; }
}

/* A block the agent has just added, anywhere in the hierarchy. */
.node.appearing { animation: tree-arrive 1600ms ease-out; }

@keyframes tree-arrive {
  from, 25% { background: var(--signal-deep); color: var(--signal); }
}

/* ---- watching a run ---- */

.block-box[data-run="running"] .block-plate {
  stroke: var(--signal);
  stroke-width: 2;
  animation: block-running 900ms ease-in-out infinite alternate;
}

@keyframes block-running {
  to { stroke: var(--signal-dim); }
}

.block-box[data-run="done"] .block-plate { stroke: var(--signal-dim); stroke-width: 1.5; }
/* A failure glows red, so it is found at a glance on a large tree: a run
   that failed in the block, or a failure flagged there for the agent. It
   wins over being picked out or pointed at, which would otherwise hide it. */
.block-box[data-run="failed"] .block-plate,
.block-box[data-failing="true"] .block-plate,
.block-box[data-run="failed"] .block-body:hover .block-plate,
.block-box[data-failing="true"] .block-body:hover .block-plate {
  stroke: var(--bad);
  stroke-width: 2.2;
  filter: drop-shadow(0 0 6px color-mix(in srgb, var(--bad) 80%, transparent));
}
.block-box[data-run="paused"] .block-plate { stroke: var(--effect); stroke-width: 2.5; }
.block-box[data-run="stopped"] .block-plate { stroke: var(--pending); stroke-width: 1.5; stroke-dasharray: 4 3; }
.block-box[data-run="stopped"] .run-note { fill: var(--pending); }

.run-note { font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em; fill: var(--signal-dim); pointer-events: none; }
.block-box[data-run="running"] .run-note { fill: var(--signal); }
.block-box[data-run="paused"] .run-note { fill: var(--effect); }
.block-box[data-run="failed"] .run-note { fill: var(--bad); }

/* A breakpoint sits beside a block's name: faint on hover, red when set. */
.breakpoint-hit { fill: transparent; cursor: pointer; }
.breakpoint-dot { fill: transparent; stroke: transparent; stroke-width: 1.5; pointer-events: none; }
.block-box:hover .breakpoint-dot { stroke: var(--ink-faint); }
.breakpoint:hover .breakpoint-dot { stroke: var(--bad); }
.block-box[data-breakpoint="true"] .breakpoint-dot { fill: var(--bad); stroke: var(--bad); }

.run-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  padding: 5px 6px 5px 12px;
  background: var(--panel);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink);
}

.run-bar[hidden] { display: none; }
.run-state { margin-right: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-state[data-tone="paused"] { color: var(--effect); }
.run-state[data-tone="good"] { color: var(--signal); }
.run-state[data-tone="bad"] { color: var(--bad); }

.run-btn {
  flex: none;
  font-family: var(--mono);
  font-size: 11px;
  padding: 4px 9px;
  border-radius: var(--radius);
  border: 1px solid var(--rule-bright);
  background: none;
  color: var(--ink-dim);
  cursor: pointer;
}

.run-btn:hover { color: var(--ink); background: var(--panel-high); }
.run-btn:disabled { color: var(--ink-faint); cursor: default; background: none; }

.watch-toggle { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-dim); cursor: pointer; }
.watch-toggle input { margin: 0; accent-color: var(--bad); }
.call-picker { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }

.watch-section pre.code { max-height: 240px; overflow: auto; white-space: pre-wrap; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* A system root in the hierarchy says which language it targets. */
.node .lang {
  margin-left: auto;
  font-size: 9.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
  flex: none;
}

.node[aria-selected="true"] .lang { color: var(--signal-dim); }

/* ---- test bench results ---- */

.run-result { display: flex; flex-direction: column; gap: 10px; margin-top: 2px; }

.run-problems ul {
  margin: 0;
  padding-left: 18px;
  font-size: 12px;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.run-result pre.code { max-height: 320px; overflow: auto; white-space: pre-wrap; }
.field textarea[data-invalid="true"] { border-color: var(--bad); }

/* ---- inspector section divisions ---- */

/* Sections are told apart by the space around their titles rather than by a
   rule of their own: a rule between every section made the panel look like a
   table. */
.inspector-body > .section { padding-top: 8px; }
.inspector-body > .insp-head { padding-bottom: 2px; }

/* ---- saved tests ---- */

.cases { display: flex; flex-direction: column; gap: 6px; }

/* The name has the row to itself, with how it went and what can be done to it
   underneath. Sharing one line with three buttons left room for about eight
   characters of it. */
.case-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 5px 8px;
  padding: 6px 8px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--ground);
}

.case-row .case-name {
  grid-column: 1 / -1;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink);
  overflow-wrap: anywhere;
}

.case-row .case-status {
  grid-column: 1;
  justify-self: start;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.case-status.passed { color: var(--signal); }
.case-status.failed, .case-status.error { color: var(--bad); }
.case-status.unchecked { color: var(--pending); }

.case-actions { grid-column: 2; justify-self: end; display: flex; gap: 4px; }

.case-actions button {
  font-family: var(--mono);
  font-size: 10.5px;
  padding: 3px 7px;
  border-radius: var(--radius);
  border: 1px solid var(--rule-bright);
  background: none;
  color: var(--ink-dim);
  cursor: pointer;
}

.case-actions button:hover:not(:disabled) { color: var(--ink); background: var(--panel-high); }
.case-actions button:disabled { opacity: 0.45; cursor: default; }

/* A box rather than an indent: this one is something to fill in, not another
   named part of what is above it, so its heading sits inside the box. */
.subsection.case-new {
  padding: 10px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--ground);
  gap: 8px;
}

.subsection.case-new h5 { margin-left: 0; }

.case-new-row { display: flex; gap: 8px; align-items: center; }

.case-new-row input[type="text"] {
  flex: 1;
  min-width: 0;
  font-family: var(--mono);
  font-size: 12px;
  background: var(--panel);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  color: var(--ink);
  padding: 6px 8px;
}

.case-new-row input[type="text"]::placeholder { color: var(--ink-faint); }
.case-new-row .btn { flex: none; }

.case-expect { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--ink-dim); }

.case-expect input[type="checkbox"] {
  flex: none;
  width: auto;
  margin: 0;
  accent-color: var(--signal);
}

.case-expect label { cursor: pointer; }
.case-expect input:disabled + label { color: var(--ink-faint); cursor: default; }

.case-summary { font-family: var(--mono); font-size: 11.5px; }
.case-summary.passed { color: var(--signal); }
.case-summary.failed { color: var(--bad); }

/* ---- following the agent ---- */

/* Shown over the last good diagram when the newest files could not be read. */
.load-error {
  flex-basis: 100%;
  max-width: min(64ch, 100%);
  padding: 8px 12px;
  background: var(--panel);
  border: 1px solid var(--bad);
  border-radius: var(--radius);
  color: var(--bad);
  font-family: var(--mono);
  font-size: 11.5px;
  white-space: pre-wrap;
  user-select: text;
}

.load-error[hidden] { display: none; }

.welcome-actions { display: flex; gap: 8px; }

.problems { display: flex; flex-direction: column; gap: 8px; }

.problem {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 0 0 0 10px;
  border: 0;
  border-left: 2px solid var(--pending);
  background: none;
  font: inherit;
  text-align: left;
  color: var(--ink);
}

.problem.error { border-left-color: var(--bad); }
button.problem { cursor: pointer; }
button.problem:hover .problem-where { color: var(--signal); }

.problem-level {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--pending);
}

.problem.error .problem-level { color: var(--bad); }
.problem-where { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); word-break: break-all; }
.problem-text { font-size: 12px; }

/* ---- new project ---- */

.new-project {
  width: min(560px, calc(100vw - 48px));
  max-height: calc(100vh - 48px);
  padding: 22px 24px 18px;
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  user-select: text;
  /* The tree grows as it is answered, and the last question has to stay
     reachable on a short window. */
  overflow-y: auto;
}

.new-project::backdrop { background: rgba(4, 6, 7, 0.72); }
.new-project h2, .waiting-card h2 { margin: 0; font-size: 17px; font-weight: 600; }
.dialog-lede { margin: 4px 0 18px; font-size: 12.5px; color: var(--ink-dim); }

/* A question is headed the way a panel's section is, with the answers
   indented under it, so the question reads louder than they do. */
.dialog-field { border: 0; margin: 0 0 18px; padding: 0 0 0 13px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
/* A question that does not apply is not asked. Without this the fieldset's
   own display would override the hidden attribute and show it anyway. */
.dialog-field[hidden] { display: none; }
.choices { display: flex; flex-direction: column; gap: 8px; }

/* A legend is not one of the fieldset's flex items, so the gap under it is
   its own, and it is widened to reach back over the indent to the edge. */
.dialog-field > legend { padding: 0; margin-bottom: 8px; width: calc(100% + 13px); }

.field-tag { font-weight: 500; letter-spacing: 0.06em; text-transform: lowercase; color: var(--ink-dim); }

.choice {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 12px;
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  background: var(--ground);
  cursor: pointer;
}

.choice:hover { border-color: var(--signal-dim); }
.choice:has(input:checked) { border-color: var(--signal); background: var(--signal-deep); }
.choice input { flex: none; margin: 3px 0 0; accent-color: var(--signal); }
.choice-body { display: flex; flex-direction: column; gap: 3px; }
.choice-title { font-size: 13px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.choice-tag {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--signal);
  border: 1px solid var(--signal-dim);
  border-radius: var(--radius);
  padding: 1px 5px;
}
.choice-text { font-size: 12px; color: var(--ink-dim); }

.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.level { position: relative; }
.level input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }

.level span {
  display: block;
  padding: 7px 0;
  text-align: center;
  font-family: var(--mono);
  font-size: 13px;
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  background: var(--ground);
  color: var(--ink-dim);
}

.level:hover span { border-color: var(--signal-dim); color: var(--ink); }
.level input:checked + span { border-color: var(--signal); background: var(--signal-deep); color: var(--signal); }
.level input:focus-visible + span { outline: 2px solid var(--signal); outline-offset: 2px; }
.level-scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.dialog-note { margin: 0; min-height: 1.5em; font-size: 12px; color: var(--ink-dim); }

.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

/* ---- a new project's first steps ---- */

.first-steps-body { margin-bottom: 18px; }
.first-step-text { margin: 0; font-size: 12.5px; color: var(--ink); }

/* The one thing to send first, set large enough to be the thing on the page. */
.first-phrase { padding: 10px 12px; border: 1px solid var(--signal); border-radius: var(--radius); background: var(--signal-deep); }
.first-phrase > span:empty { display: none; }
.first-phrase .note-phrase-words { font-size: 13px; padding: 3px 8px; border-color: var(--signal-dim); color: var(--signal); }
.first-phrase .run-btn { margin-left: auto; }

/* On a short screen the window would outgrow it, half-hiding Got it, so the
   command list is what gives way and carries the scroll. A section keeps its
   content's height unless its min-height says otherwise, so only these two shrink. */
.first-steps { display: flex; flex-direction: column; overflow: hidden; }
/* The steps scroll too on a window shorter still, rather than pushing the button out. */
.first-steps-body { min-height: 0; overflow-y: auto; }
.first-steps-body > .section.first-later { min-height: 0; }
.first-later .first-commands { overflow-y: auto; min-height: 0; }

.first-commands { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 12px; }
.first-command { display: contents; }
.first-command dt { font-family: var(--mono); font-size: 11px; color: var(--ink); }
.first-command dd { margin: 0; color: var(--ink-dim); }

/* ---- a block's code ---- */

.code-where { margin-bottom: 8px; font-family: var(--mono); font-size: 11.5px; color: var(--signal-dim); word-break: break-all; }
pre.code-excerpt { max-height: 420px; overflow: auto; padding: 8px 0; }
.excerpt-line { display: block; padding-right: 10px; }
.excerpt-line.target { background: var(--signal-deep); }

.excerpt-number {
  display: inline-block;
  width: 4.5ch;
  margin-right: 1.5ch;
  text-align: right;
  color: var(--ink-faint);
  user-select: none;
}

/* ---- the tree ---- */

/* What is part of what, and nothing else: plain lines, no arrowheads, no
   colour. Anything that carries meaning of its own is drawn as an arrow. */
.branch { fill: none; stroke: var(--rule-bright); stroke-width: 1.3; }

/* Where a block's parts are folded away and brought back. */
.fold { cursor: pointer; }
.fold-hit { fill: transparent; }
.fold-dot { fill: var(--panel); stroke: var(--rule-bright); stroke-width: 1.2; }
.fold-mark { fill: none; stroke: var(--ink-dim); stroke-width: 1.4; stroke-linecap: round; }
.fold:hover .fold-dot { stroke: var(--ink-dim); }
.fold:hover .fold-mark { stroke: var(--ink); }

/* The windows a block can open. They keep out of the way of its name until
   the pointer is on the block. */
.block-button { cursor: pointer; opacity: 0; }
.block-box:hover .block-button,
.block-box[data-selected="true"] .block-button { opacity: 1; }
.block-button-plate { fill: var(--panel); stroke: var(--rule-bright); stroke-width: 1; }
.block-button-text { font-family: var(--mono); font-size: 8px; fill: var(--ink-dim); pointer-events: none; }
.block-button:hover .block-button-plate { stroke: var(--signal-dim); }
.block-button:hover .block-button-text { fill: var(--ink); }

#canvas-svg[data-dependencies="hidden"] #access-layer { display: none; }

/* ---- an execution on the diagram ---- */

/* What exists steps back while what happened is shown. */
#canvas-svg.tracing #access-layer { opacity: 0.2; }
#canvas-svg.tracing #branch-layer { opacity: 0.55; }
#canvas-svg.tracing .block-box[data-current="true"] .block-plate { stroke: var(--exec-trigger); stroke-width: 2.2; }

.exec-line { fill: none; stroke: var(--exec-trigger); stroke-width: 1.8; opacity: 0.8; }
.exec-arrow { fill: context-stroke; }
/* Something travelled along it: it flows, the way the data went — which is
   the way the arrow points, on either drawing, because an answer coming back
   is an arrow out of whoever was called rather than the call it answers run
   backwards. */
.exec-line-group[data-data="true"] .exec-line {
  stroke: var(--signal);
  stroke-dasharray: 7 5;
  animation: exec-flow 900ms linear infinite;
}
/* Nothing did: it lights up. */
.exec-line-group[data-data="false"] .exec-line { filter: drop-shadow(0 0 3px var(--exec-trigger)); }
.exec-line-group .exec-line { opacity: 1; stroke-width: 2.6; }

@keyframes exec-flow {
  to { stroke-dashoffset: -12; }
}

.exec-label {
  font-family: var(--mono);
  font-size: 9.5px;
  fill: var(--ink);
  paint-order: stroke;
  stroke: var(--ground);
  stroke-width: 3px;
  pointer-events: none;
}

/* The word on an arrow carries its own plate, because the arrow is drawn over
   the blocks and the word can land on one. The halo on .exec-label above is
   for the flow, whose words have no plate; under a plate it paints nothing. */
.exec-label-plate { fill: var(--ground); stroke: var(--rule-bright); stroke-width: 1; }

/* The step is drawn over the blocks so it is never hidden, which means it must
   not take their clicks: an arrow meets a block exactly where that block's
   fold dot and breakpoint sit. So the whole layer is see-through to the
   pointer, and the step is opened from its own word, which is put where no
   block is. */
#exec-layer { pointer-events: none; }
#exec-layer .exec-label-plate { pointer-events: auto; cursor: pointer; }

.exec-outside-dot { fill: var(--ground); stroke: var(--exec-trigger); stroke-width: 1.8; }
.exec-outside-label { font-family: var(--mono); font-size: 9px; fill: var(--exec-trigger); pointer-events: none; }

.exec-effect-chip { fill: color-mix(in srgb, var(--effect) 14%, var(--ground)); stroke: var(--effect); stroke-width: 1; }
.exec-effect-text { font-family: var(--mono); font-size: 9px; fill: var(--effect); pointer-events: none; }
.exec-effect[data-current="true"] .exec-effect-chip { stroke-width: 2; fill: color-mix(in srgb, var(--effect) 30%, var(--ground)); }

.exec-bar {
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-width: min(780px, 100%);
  padding: 5px 6px;
  background: var(--panel);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink);
}

.exec-bar[hidden] { display: none; }
.exec-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

.exec-select {
  font-family: var(--mono);
  font-size: 11.5px;
  padding: 3px 6px;
  max-width: 240px;
  background: var(--panel-high);
  color: var(--ink);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
}

/* Where a trace came from is never left to be guessed. The one written down
   keeps the dashed border that says nobody has seen it run. */
.exec-source[data-source="declared"] { border-style: dashed; }
.exec-source:disabled, .exec-source:disabled:hover { opacity: 0.45; cursor: default; color: var(--ink-dim); background: none; }

/* What the recording says of the steps written down. Quiet when it agrees;
   red, and a way to the trouble, when it does not. */
.exec-verdict { font-family: var(--mono); font-size: 11.5px; color: var(--signal); padding: 0 4px; white-space: nowrap; }
.exec-verdict[data-none="true"] { color: var(--ink-dim); }
.chip.exec-verdict[data-bad="true"] { color: var(--bad); border-color: var(--bad); padding: 4px 10px; }

/* Why the execution picked cannot be recorded, readable without hovering. */
.exec-why { padding: 0 4px 1px; color: var(--ink-dim); }

.exec-count { color: var(--ink-dim); padding-left: 2px; white-space: nowrap; }

.exec-caption { display: flex; align-items: baseline; gap: 8px; padding: 0 4px 1px; min-width: 0; }
.exec-caption-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-dim); user-select: text; }

/* ---- the test bench, in a window that can be moved off the drawing ---- */

/* The host covers the canvas and lets every pointer through, so what is behind
   a bench window can still be dragged, zoomed and clicked. */
.panels {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}

.panels[hidden] { display: none; }

.bench-window {
  position: absolute;
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
  overflow: hidden;
}

/* Rolled up to its title, so the drawing underneath is clear without losing
   the values typed into it. */
.bench-window[data-minimised="true"] { height: auto; }

/* The edges and corners it is pulled by. The window clips what it draws, so
   they sit just inside its border rather than straddling it: anything hanging
   outside would be neither seen nor catchable. */
.bench-grip { position: absolute; touch-action: none; z-index: 1; }
.bench-grip-n { top: 0; left: 12px; right: 12px; height: 5px; cursor: ns-resize; }
.bench-grip-s { bottom: 0; left: 12px; right: 12px; height: 5px; cursor: ns-resize; }
.bench-grip-e { right: 0; top: 12px; bottom: 12px; width: 5px; cursor: ew-resize; }
.bench-grip-w { left: 0; top: 12px; bottom: 12px; width: 5px; cursor: ew-resize; }
.bench-grip-ne { top: 0; right: 0; width: 14px; height: 14px; cursor: nesw-resize; }
.bench-grip-nw { top: 0; left: 0; width: 14px; height: 14px; cursor: nwse-resize; }
.bench-grip-se { bottom: 0; right: 0; width: 14px; height: 14px; cursor: nwse-resize; }
.bench-grip-sw { bottom: 0; left: 0; width: 14px; height: 14px; cursor: nesw-resize; }

/* The corner that is pulled most often says so, quietly. */
.bench-grip-se::after {
  content: "";
  position: absolute;
  right: 3px;
  bottom: 3px;
  width: 6px;
  height: 6px;
  border-right: 1px solid var(--rule-bright);
  border-bottom: 1px solid var(--rule-bright);
}

.bench-window.sizing { box-shadow: 0 22px 52px rgba(0, 0, 0, 0.66); }
.bench-window.sizing .bench-grip-se::after { border-color: var(--signal-dim); }

/* While an edge is being pulled the pointer leaves the thin strip it started
   on, so the cursor is held by the whole window instead of flickering. */
body[data-sizing="ns"] { cursor: ns-resize; }
body[data-sizing="ew"] { cursor: ew-resize; }
body[data-sizing="nesw"] { cursor: nesw-resize; }
body[data-sizing="nwse"] { cursor: nwse-resize; }

/* Dragged by its head, which says so by the cursor it shows. */
.bench-window-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 10px 9px 13px;
  border-bottom: 1px solid var(--rule);
  background: var(--panel-high);
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.bench-window.dragging { box-shadow: 0 22px 52px rgba(0, 0, 0, 0.66); }
.bench-window.dragging .bench-window-head { cursor: grabbing; }
.bench-window-head h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }

/* Laid out in columns as soon as there is room for them, so a form, what came
   back and the saved tests sit side by side instead of down one long strip.
   Aligned to the top, because a short column must not stretch to match a tall
   one. */
.bench-window-body {
  overflow: auto;
  flex: 1;
  min-height: 0;
  padding: 12px 14px 16px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  align-content: start;
  align-items: start;
  gap: 18px 20px;
}

/* A grid item is as wide as its widest child unless told otherwise, so one
   long line of JSON would otherwise push its column past the window. */
.bench-window-body > * { min-width: 0; }
.bench-fields > .field { min-width: 0; }

/* The values a run starts from, side by side while the window is wide enough.
   Anything that needs the width — a nested shape, a box of JSON — takes the
   whole row rather than being squeezed into a column. */
.bench-fields {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  align-items: start;
  gap: 10px 14px;
}

.bench-fields > .field:has(textarea),
.bench-fields > .field:has(.subfields) { grid-column: 1 / -1; }

/* Roll up and close, in the corner of the head. */
.window-buttons { display: flex; gap: 5px; margin-left: auto; flex: none; }
.window-buttons .window-close { margin-left: 0; }

/* ---- a window over the drawing ---- */

/* A block on the tree says what it is; everything else about it is read here,
   in a window big enough for it. */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 26px;
  background: rgba(4, 6, 7, 0.74);
}

.overlay[hidden] { display: none; }

.window {
  display: flex;
  flex-direction: column;
  width: min(980px, 100%);
  max-height: 100%;
  background: var(--panel);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  overflow: hidden;
}

.window-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--rule);
}

.window-names h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.window-sub { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); word-break: break-all; }

.window-close {
  margin-left: auto;
  flex: none;
  padding: 2px 8px;
  font-size: 13px;
  color: var(--ink-dim);
  background: none;
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  cursor: pointer;
}

.window-close:hover { color: var(--ink); background: var(--panel-high); }

.window-body { overflow: auto; padding: 14px 16px 20px; user-select: text; }
.window-sections { display: flex; flex-direction: column; gap: 18px; }
.window-code { max-height: none; font-size: 12px; }
.window-foot { display: flex; gap: 12px; align-items: center; }

.insp-windows { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

/* A button beside what it acts on, rather than stretched across the row. */
.port-row .btn { width: fit-content; }

/* ---- a block's versions ---- */

/* A version is a saved test's row: its subject on a line of its own, and when
   and by whom underneath, where a test says how it went. A comparison is the
   same rows again, with the other version's result where the buttons go. */
.version-row .version-meta { grid-column: 1; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
.version-row > .bench-note, .version-row > .version-save, .version-compare { grid-column: 1 / -1; }
.version-compare { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.version-compare > .btn { align-self: flex-start; }
.compare-row .case-status.compare-then { grid-column: 2; justify-self: end; }
.compare-row[data-differs="true"] { border-color: var(--rule-bright); }
.case-saved { color: var(--ink-faint); }

/* Saved versions and git history are the section's two named parts. A button
   sits beside a list rather than stretched across it. What the person wrote
   about a saved version is kept as they wrote it, line breaks included. */
.version-part { margin-top: 4px; }
.version-part > .btn { align-self: flex-start; }
.version-row > .version-about { white-space: pre-wrap; overflow-wrap: anywhere; }

/* Which version the block is on. The one it is exactly as is lit, as a chip
   that is on; the one it has changed since is marked, but quietly. Neither is
   anything wrong, so neither is ever red. The same badges say it in the
   panel's header. */
.version-row[data-in-use="true"] { border-color: var(--signal-dim); }
.version-row[data-changed-from="true"] { border-color: var(--rule-bright); }
.version-line { grid-column: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.version-line .badge { padding: 1px 6px; }
.badge.in-use { color: var(--signal); border-color: var(--signal-dim); background: var(--signal-deep); }

/* The form for saving one is a box, like the one for saving a test: something
   to fill in rather than another part of what is above it. */
.version-save {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--ground);
}

.version-save .field input, .version-save .field textarea { background: var(--panel); }
.version-save .field textarea { min-height: 64px; }
.version-save-actions { display: flex; gap: 6px; }

/* ---- one execution, end to end ---- */

/* Which of the two drawings is on the canvas. */
.exec-shows { display: flex; gap: 4px; margin-right: 2px; }

/* A box of the flow is where the run was, not a part of the architecture, so
   it is drawn flatter than a block on the tree. */
.flow-box { cursor: pointer; }
.flow-box .block-plate { stroke-dasharray: none; }
.flow-box[data-current="true"] .block-plate { stroke: var(--exec-trigger); stroke-width: 2.2; }
#canvas-svg .exec-line-group[data-current="none"] .exec-line { opacity: 0.5; }

/* ---- notes ---- */

/* A note is a conversation, not a problem: nothing about it is wrong, so it is
   never red. What waits for the person is amber, the colour of something to
   look at; what is with the agent is quiet, because there is nothing to do
   about it here but wait. */

/* The count on a block's corner, straddling it so it covers neither the name
   nor the buttons that show on the pointer. */
.note-mark { cursor: pointer; }
.note-mark-dot { fill: var(--panel-high); stroke: var(--ink-dim); stroke-width: 1.2; }
.note-mark-count { font-family: var(--mono); font-size: 9px; font-weight: 700; fill: var(--ink); pointer-events: none; }
.note-mark[data-waiting="person"] .note-mark-dot { fill: var(--effect); stroke: var(--effect); }
.note-mark[data-waiting="person"] .note-mark-count { fill: var(--ground); }
.note-mark:hover .note-mark-dot { stroke: var(--ink); }

/* The bar above the drawing, beside the run bar and drawn like it. The
   changes bar sits beside it and is drawn the same. */
.notes-bar,
.changes-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  max-width: 100%;
  padding: 5px 6px 5px 12px;
  background: var(--panel);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink);
}

.notes-bar[hidden], .changes-bar[hidden] { display: none; }
.notes-bar-part { display: flex; align-items: center; gap: 6px; }
.notes-bar-part[data-waiting="person"] > span { color: var(--effect); }

/* What to tell the agent: the words themselves, set as something to type, with
   a button to copy them. */
.note-phrase { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 11.5px; color: var(--ink-dim); }
.note-phrase.quiet { font-size: 11px; color: var(--ink-faint); }
.note-phrase-words {
  font-family: var(--mono);
  font-size: 11px;
  padding: 1px 6px;
  border: 1px solid var(--rule-bright);
  border-radius: 2px;
  background: var(--ground);
  color: var(--ink);
  overflow-wrap: anywhere;
}
.note-phrase .run-btn, .notes-bar .run-btn, .changes-bar .run-btn { padding: 2px 8px; font-size: 10.5px; }

/* What changed, said on the bar itself; pressing it opens the list. */
.changes-open {
  border: 0;
  background: none;
  padding: 0;
  font: inherit;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.changes-open:hover { color: var(--signal); }

/* One change: the block, where it is, and each difference on a line. */
.change-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 0 0 0 10px;
  border: 0;
  border-left: 2px solid var(--ink-faint);
  background: none;
  font: inherit;
  text-align: left;
  color: var(--ink);
}
button.change-row { cursor: pointer; }
button.change-row:hover .change-where { color: var(--signal); }
.change-head { font-size: 12px; }
.change-where { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); word-break: break-all; }
.change-line { font-size: 12px; color: var(--ink-dim); }
.change-row .btn { align-self: flex-start; margin-top: 2px; }

/* The two points the list can start from. */
.changes-point { display: flex; align-items: center; gap: 8px; }
.changes-point label { font-size: 12px; color: var(--ink-dim); }

.changes-actions { display: flex; gap: 8px; }

/* The neutral dot on a changed block while the list is open: a marker only,
   drawn like a note's count, so it never takes a click from the block. */
.change-mark { pointer-events: none; }
.change-mark-dot { fill: var(--panel-high); stroke: var(--ink-dim); stroke-width: 1.2; }

/* One note: whose turn it is and when, then each message in turn. */
.note-card {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 8px 10px;
  border: 1px solid var(--rule);
  border-left: 2px solid var(--ink-faint);
  border-radius: var(--radius);
  background: var(--ground);
}

.note-card[data-waiting="person"] { border-left-color: var(--effect); }
.note-card[data-waiting="none"] { opacity: 0.8; }
.note-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.note-state { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-dim); }
.note-card[data-waiting="person"] .note-state { color: var(--effect); }
.note-when { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }
.note-message { display: flex; flex-direction: column; gap: 2px; }
.note-from { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.note-message[data-from="agent"] .note-from { color: var(--ink-dim); }
.note-text { margin: 0; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.note-card .case-actions { align-self: flex-end; }

/* A run carried by a note, folded to one line until it is wanted. */
.note-run { font-size: 11.5px; color: var(--ink-dim); }
.note-run > summary { cursor: pointer; font-family: var(--mono); font-size: 11px; color: var(--bad); }
.note-run[open] { display: flex; flex-direction: column; gap: 6px; }
.note-run pre.code { max-height: 200px; overflow: auto; white-space: pre-wrap; }
.note-run ul { margin: 0; padding-left: 16px; }

/* Writing one is a box, like saving a version: something to fill in. */
.note-form {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--ground);
}

.note-form textarea {
  font: inherit;
  font-size: 12px;
  min-height: 64px;
  resize: vertical;
  background: var(--panel);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  color: var(--ink);
  padding: 6px 8px;
  width: 100%;
}

.note-form textarea::placeholder { color: var(--ink-faint); }
.note-form-actions { display: flex; gap: 6px; }
.note-leave, .note-resolved-toggle { align-self: flex-start; }
.problem.note-row { border-left-color: var(--ink-faint); }
.problem.note-row[data-waiting="person"] { border-left-color: var(--effect); }
.problem.note-row[data-waiting="person"] .problem-level { color: var(--effect); }

/* Under a run that went wrong in the bench: whether to flag it for the agent. */
.flag-offer { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 11.5px; color: var(--ink-dim); }
.flag-offer .run-btn { padding: 2px 8px; font-size: 10.5px; }

/* The red flag on a block's corner: a run failed in it, or a note flags a
   failure there. Red is spent here because something is wrong. */
.block-flag { display: none; pointer-events: bounding-box; }
.block-box[data-run-flag="true"] .block-flag,
.block-box[data-failing="true"] .block-flag { display: inline; }
.block-flag-pole { fill: none; stroke: var(--flag-red); stroke-width: 1.5; stroke-linecap: round; }
.block-flag-cloth { fill: var(--flag-red); stroke: var(--flag-red); stroke-width: 1; stroke-linejoin: round; }
.block-box[data-run-flag="true"] .block-flag-cloth { filter: drop-shadow(0 0 3px color-mix(in srgb, var(--bad) 80%, transparent)); }

/* While the agent works on a note, a ring spreads out from its count. */
.note-mark-ring { fill: none; stroke: var(--ink); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: note-working 1.8s ease-out infinite; pointer-events: none; }
@keyframes note-working {
  from { transform: scale(1); opacity: 0.9; }
  to { transform: scale(1.9); opacity: 0; }
}

/* What a note is about, when it is narrower than its block, and what the
   agent is doing with it. */
.note-on { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim); }
.note-on .run-btn { padding: 1px 7px; font-size: 10px; }
.note-working { margin: 0; font-size: 11px; color: var(--ink); }
.note-card[data-working="true"] { border-left-color: var(--ink); }
/* A note flagging something that went wrong says so first, in red. */
.note-error { margin: 0; font-size: 12px; color: var(--bad); overflow-wrap: anywhere; }
.note-error-word { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; margin-right: 4px; }
.note-retry { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.note-retry .run-btn { padding: 2px 8px; font-size: 10.5px; }

/* The commit an answer was made in, and what can be done with it. */
.note-commit { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 11px; color: var(--ink-dim); }
.note-commit code { font-family: var(--mono); color: var(--ink); }
.note-commit .case-actions { margin-left: auto; }

/* Running what a note flags again: put right in green, still wrong in red. */
.note-rerun { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 11.5px; color: var(--ink-dim); }
.note-rerun[data-tone="good"] > span { color: var(--signal); }
.note-rerun[data-tone="bad"] > span { color: var(--bad); }
.note-rerun .run-btn { padding: 2px 8px; font-size: 10.5px; }

.note-commands { align-self: flex-start; }

/* A problem on a block, with a way to flag it for the agent beside it. */
.problem-line { display: flex; align-items: flex-start; gap: 6px; }
.problem-line > .problem { flex: 1; min-width: 0; }
.problem-flag { flex: none; padding: 1px 7px; font-size: 10px; }
.problem-flagged { flex: none; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); }

/* Every command, in its window. */
.commands .command-summary { margin: 0; font-size: 12px; color: var(--ink); }
.commands .command-usage { font-family: var(--mono); font-size: 10.5px; }

/* Without the ring's movement, the count says the agent is working on it by
   a heavier outline instead. */
@media (prefers-reduced-motion: reduce) {
  .note-mark[data-working="true"] .note-mark-dot { stroke: var(--ink); stroke-width: 2.5; }
}

/* ---- rules ---- */

/* The two rules offered between two picked-out blocks, each a button worded
   as the sentence it would make. */
.rule-offer { display: flex; flex-direction: column; gap: 4px; }
.rule-offer-made { font-size: 12px; color: var(--ink); }
.rule-why {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--ground);
  border: 1px solid var(--rule-bright);
  border-radius: var(--radius);
  color: var(--ink);
  padding: 6px 8px;
  width: 100%;
}
.rule-why::placeholder { color: var(--ink-faint); }

/* One rule on the project's panel: the sentence, where it stands, and what
   can be done with it. */
.rule-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 10px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--ground);
}
.rule-words { font-size: 12px; color: var(--ink); }
.rule-paths { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }
.rule-state { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; font-size: 11.5px; color: var(--ink-dim); }
.rule-state.bad { color: var(--bad); }
/* The breaks, grouped by how sure Fragmentor is: red only where it is sure
   something is wrong, amber for a guess, on the words and the chips alike. */
.rule-broke { display: contents; }
.rule-broke.bad { color: var(--bad); }
.rule-broke.warn { color: var(--effect); }
.rule-broke .btn { color: inherit; border-color: color-mix(in srgb, currentColor 45%, transparent); }
.rule-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rule-remove { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
