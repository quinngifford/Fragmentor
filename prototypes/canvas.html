<title>Fragmentor Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  /* A committed single visual world: this is an instrument panel, and the
     phosphor green is signal colour, not decoration. Every surface paints
     itself so the page holds on any host ground. */
  :root {
    --ground: #07090a;
    --panel: #0d1113;
    --panel-high: #131a1c;
    --rule: #1d2629;
    --rule-bright: #2b3a3e;
    --ink: #c6d5d0;
    --ink-dim: #6b807b;
    --ink-faint: #475855;
    --signal: #4fe38f;
    --signal-dim: #2b8d5c;
    --signal-deep: #1a4b34;
    --effect: #e2a54b;
    --pending: #7a8b96;
    --radius: 3px;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Fills the viewport when there is one, but keeps a real size if 100vh
     resolves oddly inside a host frame. Panes scroll, the page does not. */
  .shell { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; min-height: 660px; }

  /* ---- top bar ---- */

  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--rule);
    background: var(--panel);
    flex-wrap: wrap;
  }

  .mark { padding-right: 14px; border-right: 1px solid var(--rule); }

  .mark strong {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--signal);
  }

  .tabs { display: flex; gap: 4px; padding-right: 14px; border-right: 1px solid var(--rule); }

  .tab, .toggle, .zoom-btn, .chip {
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 4px 10px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    background: none;
    color: var(--ink-dim);
    cursor: pointer;
  }

  .tab:hover, .toggle:hover, .zoom-btn:hover { color: var(--ink); background: var(--panel-high); }
  .tab[aria-pressed="true"] { border-color: var(--signal-dim); color: var(--signal); background: var(--signal-deep); }

  .toggle { border-color: var(--rule-bright); }
  .toggle[aria-pressed="true"] { color: var(--signal); border-color: var(--signal-dim); }

  .crumbs { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 12px; }

  .crumb {
    background: none;
    border: 0;
    padding: 3px 7px;
    border-radius: var(--radius);
    font: inherit;
    color: var(--ink-dim);
    cursor: pointer;
  }

  .crumb:hover { color: var(--signal); background: var(--panel-high); }
  .crumb[aria-current="true"] { color: var(--ink); background: var(--panel-high); cursor: default; }
  .crumb-sep { color: var(--ink-faint); }

  .toolbar { margin-left: auto; display: flex; gap: 6px; align-items: center; }

  /* ---- panes ---- */

  .panes { display: grid; min-height: 0; }

  .rail, .inspector { background: var(--panel); overflow-y: auto; min-height: 0; }
  .rail { border-right: 1px solid var(--rule); }
  .inspector { border-left: 1px solid var(--rule); }

  .pane-title {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 12px 16px 6px;
  }

  /* ---- hierarchy rail ---- */

  .tree { padding: 0 8px 20px; display: flex; flex-direction: column; gap: 1px; }

  .node {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 5px 8px;
    border: 0;
    border-radius: var(--radius);
    background: none;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 12px;
    text-align: left;
    cursor: pointer;
  }

  .node:hover { background: var(--panel-high); color: var(--ink); }
  .node[aria-selected="true"] { background: var(--signal-deep); color: var(--signal); }
  .node .glyph { color: var(--ink-faint); flex: none; width: 11px; text-align: center; }
  .node[aria-selected="true"] .glyph { color: var(--signal); }
  .node .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- canvas ---- */

  .canvas-wrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--ground); }
  #canvas-svg { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #canvas-svg.panning { cursor: grabbing; }
  #canvas-svg.dragging { cursor: move; }

  .canvas-empty {
    position: absolute;
    inset: 26px auto auto 26px;
    color: var(--ink-dim);
    font-size: 13px;
    max-width: 46ch;
    white-space: pre-wrap;
  }

  .zoom-bar {
    position: absolute;
    left: 14px;
    bottom: 14px;
    display: flex;
    gap: 4px;
    align-items: center;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--rule-bright);
    border-radius: var(--radius);
    padding: 4px;
  }

  .zoom-btn { border-color: transparent; min-width: 28px; text-align: center; }
  .zoom-level { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); min-width: 44px; text-align: center; }

  .hint {
    position: absolute;
    right: 14px;
    top: 12px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-faint);
    text-align: right;
    pointer-events: none;
  }

  /* ---- block drawing ---- */

  .block-box { cursor: move; }
  .block-plate { fill: var(--panel-high); stroke: var(--rule-bright); stroke-width: 1; }
  .block-box:hover .block-plate { stroke: var(--signal-dim); }
  .block-box[data-selected="true"] .block-plate { stroke: var(--signal); stroke-width: 1.8; }
  .block-box[data-boundary="true"] .block-plate { fill: var(--panel); stroke-dasharray: 3 3; }
  .block-head { fill: var(--panel); pointer-events: none; }

  .block-name { font-family: var(--sans); font-size: 12.5px; font-weight: 600; fill: var(--ink); pointer-events: none; }
  .block-kind { font-family: var(--mono); font-size: 9px; fill: var(--ink-faint); letter-spacing: 0.08em; pointer-events: none; }
  .group-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; pointer-events: none; }
  .port-label { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-dim); pointer-events: none; }
  .bus-out-label { font-family: var(--mono); font-size: 9px; fill: var(--ink-faint); letter-spacing: 0.06em; pointer-events: none; }
  .each-badge { font-family: var(--mono); font-size: 9px; fill: var(--signal); pointer-events: none; }
  .block-divider { stroke: var(--rule-bright); pointer-events: none; }

  .group-bracket { stroke-width: 2; fill: none; }
  .bus-dot { stroke-width: 1.5; }
  .cap-line { stroke: var(--effect); stroke-width: 1.2; stroke-dasharray: 2 3; opacity: 0.65; pointer-events: none; }
  .cap-dot { fill: var(--panel); stroke: var(--effect); stroke-width: 1.5; }

  .bus { fill: none; stroke-width: 2; opacity: 0.55; }
  .bus-hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
  .bus-group:hover .bus { opacity: 1; stroke-width: 3; }
  .bus-group[data-selected="true"] .bus { opacity: 1; stroke-width: 3.5; }
  .bus-group[data-linked="true"] .bus { opacity: 1; stroke-width: 3; }
  .bus-count { font-family: var(--mono); font-size: 9px; pointer-events: none; }

  /* ---- inspector ---- */

  .inspector-body { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 16px; }

  .insp-head { display: flex; flex-direction: column; gap: 6px; }
  .insp-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .insp-id { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); word-break: break-all; }

  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

  .badge {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1px solid var(--rule-bright);
    color: var(--ink-dim);
  }

  .badge.composite { border-color: var(--signal-dim); color: var(--signal); }
  .badge.state { border-color: #3d4a52; color: var(--pending); }

  .responsibility { margin: 0; font-size: 13px; color: var(--ink); }

  .section h3 {
    margin: 0 0 8px;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 500;
  }

  .ports { display: flex; flex-direction: column; gap: 8px; }
  .group-heading { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); margin: 4px 0 2px; }

  .port-row { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; border-left: 2px solid var(--signal-deep); }
  .port-row.cap { border-left-color: var(--effect); }
  .port-row .pname { font-family: var(--mono); font-size: 12px; color: var(--ink); }
  .port-row .ptype { font-family: var(--mono); font-size: 11px; color: var(--signal-dim); word-break: break-word; }
  .port-row .pdesc { font-size: 11.5px; color: var(--ink-dim); }

  .btn {
    font: inherit;
    font-size: 12px;
    padding: 7px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--signal-dim);
    background: var(--signal-deep);
    color: var(--signal);
    cursor: pointer;
  }

  .btn:hover { background: var(--signal-dim); color: var(--ground); }
  .btn[disabled] { border-color: var(--rule-bright); background: transparent; color: var(--ink-faint); cursor: not-allowed; }

  .btn.quiet { border-color: var(--rule-bright); background: transparent; color: var(--ink-dim); }
  .btn.quiet:hover { color: var(--ink); background: var(--panel-high); }

  code, pre { font-family: var(--mono); }

  pre.code {
    margin: 0;
    padding: 10px;
    background: var(--ground);
    border: 1px solid var(--rule-bright);
    border-radius: var(--radius);
    font-size: 11px;
    line-height: 1.6;
    color: var(--ink);
    overflow-x: auto;
    white-space: pre;
  }

  .code-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .chip { border-color: var(--rule-bright); }
  .chip[aria-pressed="true"] { color: var(--signal); border-color: var(--signal-dim); background: var(--signal-deep); }

  .code-editor {
    width: 100%;
    min-height: 240px;
    resize: vertical;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.6;
    background: var(--ground);
    border: 1px solid var(--rule-bright);
    border-radius: var(--radius);
    color: var(--ink);
    padding: 10px;
    white-space: pre;
    overflow-wrap: normal;
    overflow-x: auto;
  }

  .code-editor[readonly] { color: var(--ink-dim); }
  .code-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }

  .swatch-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--rule-bright);
    cursor: pointer;
    padding: 0;
  }

  .swatch-btn[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }

  .bench { display: flex; flex-direction: column; gap: 10px; }
  .bench-note { font-size: 11.5px; color: var(--ink-dim); margin: 0; }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > label { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }

  .field input, .field select, .field textarea {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--ground);
    border: 1px solid var(--rule-bright);
    border-radius: var(--radius);
    color: var(--ink);
    padding: 6px 8px;
    width: 100%;
  }

  .field textarea { min-height: 58px; resize: vertical; }
  .field input[type="checkbox"] { width: auto; accent-color: var(--signal); }
  .subfields { display: flex; flex-direction: column; gap: 8px; padding-left: 10px; border-left: 1px solid var(--rule); }

  /* ---- status ---- */

  .status {
    display: flex;
    gap: 22px;
    padding: 8px 16px;
    border-top: 1px solid var(--rule);
    background: var(--panel);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    flex-wrap: wrap;
  }

  .status b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .status .warn { color: var(--pending); }

  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Narrow enough that three columns would starve the canvas: stack instead.
     The override has to win over the inline columns the pane toggles set. */
  @media (max-width: 1040px) {
    .shell { height: auto; min-height: 0; }
    .panes { grid-template-columns: 1fr !important; grid-template-rows: auto minmax(420px, 1fr) auto; }
    .rail { border-right: 0; border-bottom: 1px solid var(--rule); max-height: 172px; }
    .inspector { border-left: 0; border-top: 1px solid var(--rule); max-height: 460px; }
    .canvas-wrap { min-height: 420px; }
    .hint { display: none; }
  }
</style>

<div class="shell">
  <header class="topbar">
    <div class="mark"><strong>Fragmentor</strong></div>
    <nav class="tabs" id="project-tabs" aria-label="Projects"></nav>
    <nav class="crumbs" id="crumbs" aria-label="Block hierarchy"></nav>
    <div class="toolbar">
      <button class="toggle" id="toggle-rail" aria-pressed="true">Hierarchy</button>
      <button class="toggle" id="toggle-inspector" aria-pressed="true">Inspector</button>
    </div>
  </header>

  <div class="panes" id="panes">
    <aside class="rail" id="rail">
      <div class="pane-title">Hierarchy</div>
      <div class="tree" id="tree" role="tree"></div>
    </aside>

    <div class="canvas-wrap" id="canvas-wrap">
      <svg id="canvas-svg"><g id="viewport"><g id="bus-layer"></g><g id="node-layer"></g></g></svg>
      <div class="zoom-bar">
        <button class="zoom-btn" id="zoom-out" title="Zoom out">&minus;</button>
        <span class="zoom-level" id="zoom-level">100%</span>
        <button class="zoom-btn" id="zoom-in" title="Zoom in">+</button>
        <button class="zoom-btn" id="zoom-fit" title="Fit the diagram">Fit</button>
        <button class="zoom-btn" id="layout-reset" title="Return blocks to the automatic layout">Re-layout</button>
      </div>
      <div class="hint">drag to move &middot; ctrl-click to multi-select &middot; scroll to zoom &middot; drag background to pan</div>
    </div>

    <aside class="inspector" id="inspector-pane">
      <div class="pane-title">Inspector</div>
      <div class="inspector-body" id="inspector"></div>
    </aside>
  </div>

  <footer class="status" id="status"></footer>
</div>

<script>
  const PROJECTS = [
  {
    "key": "job-ranker",
    "label": "Job Ranker",
    "manifest": {
      "name": "Job Relevance Ranker",
      "goal": "Read job postings from a local file, score each one against a candidate profile, and return them ordered from most to least relevant with a short explanation for each score.",
      "rootBlock": "rank-jobs",
      "granularity": {
        "level": 3,
        "maxDepth": 4
      }
    },
    "rootPath": "rank-jobs",
    "blocks": {
      "rank-jobs": {
        "path": "rank-jobs",
        "id": "rank-jobs",
        "name": "Rank Jobs",
        "responsibility": "Read job postings from a file and return them ordered by how well they match a candidate profile, with reasons.",
        "kind": "composite",
        "functionName": "rankJobs",
        "inputs": [
          {
            "name": "sourcePath",
            "type": "string",
            "typeIr": {
              "kind": "string"
            },
            "description": "File holding the postings to rank."
          },
          {
            "name": "profile",
            "type": "{ skills: string[] }",
            "typeIr": {
              "kind": "object",
              "fields": {
                "skills": {
                  "type": {
                    "kind": "array",
                    "of": {
                      "kind": "string"
                    }
                  }
                }
              }
            },
            "description": "The candidate to rank against."
          }
        ],
        "outputs": [
          {
            "name": "ranked",
            "type": "{ title: string; company: string; score: number; reasons: string[] }[]",
            "typeIr": {
              "kind": "array",
              "of": {
                "kind": "object",
                "fields": {
                  "title": {
                    "type": {
                      "kind": "string"
                    }
                  },
                  "company": {
                    "type": {
                      "kind": "string"
                    }
                  },
                  "score": {
                    "type": {
                      "kind": "number"
                    }
                  },
                  "reasons": {
                    "type": {
                      "kind": "array",
                      "of": {
                        "kind": "string"
                      }
                    }
                  }
                }
              }
            },
            "description": "Best match first."
          }
        ],
        "capabilities": [
          {
            "name": "files",
            "capability": "FileSystem",
            "description": "Reads the postings file."
          }
        ],
        "children": [
          {
            "block": "load-postings",
            "mode": "once",
            "eachOver": null,
            "path": "rank-jobs/load-postings",
            "kind": "leaf",
            "name": "Load Postings",
            "functionName": "loadPostings"
          },
          {
            "block": "extract-profile-keywords",
            "mode": "once",
            "eachOver": null,
            "path": "rank-jobs/extract-profile-keywords",
            "kind": "leaf",
            "name": "Extract Profile Keywords",
            "functionName": "extractProfileKeywords"
          },
          {
            "block": "score-posting",
            "mode": "each",
            "eachOver": "posting",
            "path": "rank-jobs/score-posting",
            "kind": "composite",
            "name": "Score Posting",
            "functionName": "scorePosting"
          },
          {
            "block": "rank-results",
            "mode": "once",
            "eachOver": null,
            "path": "rank-jobs/rank-results",
            "kind": "leaf",
            "name": "Rank Results",
            "functionName": "rankResults"
          }
        ],
        "order": [
          "load-postings",
          "extract-profile-keywords",
          "score-posting",
          "rank-results"
        ],
        "wires": [
          {
            "text": "input.sourcePath -> load-postings.path",
            "source": {
              "from": "input",
              "port": "sourcePath"
            },
            "target": {
              "to": "block",
              "block": "load-postings",
              "port": "path"
            },
            "type": "string",
            "isArray": false
          },
          {
            "text": "input.profile -> extract-profile-keywords.profile",
            "source": {
              "from": "input",
              "port": "profile"
            },
            "target": {
              "to": "block",
              "block": "extract-profile-keywords",
              "port": "profile"
            },
            "type": "{ skills: string[] }",
            "isArray": false
          },
          {
            "text": "load-postings.postings -> score-posting.posting",
            "source": {
              "from": "block",
              "block": "load-postings",
              "port": "postings"
            },
            "target": {
              "to": "block",
              "block": "score-posting",
              "port": "posting"
            },
            "type": "{ title: string; company: string; description: string }[]",
            "isArray": true
          },
          {
            "text": "extract-profile-keywords.keywords -> score-posting.keywords",
            "source": {
              "from": "block",
              "block": "extract-profile-keywords",
              "port": "keywords"
            },
            "target": {
              "to": "block",
              "block": "score-posting",
              "port": "keywords"
            },
            "type": "string[]",
            "isArray": true
          },
          {
            "text": "load-postings.postings -> rank-results.postings",
            "source": {
              "from": "block",
              "block": "load-postings",
              "port": "postings"
            },
            "target": {
              "to": "block",
              "block": "rank-results",
              "port": "postings"
            },
            "type": "{ title: string; company: string; description: string }[]",
            "isArray": true
          },
          {
            "text": "score-posting.score -> rank-results.scores",
            "source": {
              "from": "block",
              "block": "score-posting",
              "port": "score"
            },
            "target": {
              "to": "block",
              "block": "rank-results",
              "port": "scores"
            },
            "type": "number[]",
            "isArray": true
          },
          {
            "text": "score-posting.reasons -> rank-results.reasons",
            "source": {
              "from": "block",
              "block": "score-posting",
              "port": "reasons"
            },
            "target": {
              "to": "block",
              "block": "rank-results",
              "port": "reasons"
            },
            "type": "string[][]",
            "isArray": true
          },
          {
            "text": "rank-results.ranked -> output.ranked",
            "source": {
              "from": "block",
              "block": "rank-results",
              "port": "ranked"
            },
            "target": {
              "to": "output",
              "port": "ranked"
            },
            "type": "{ title: string; company: string; score: number; reasons: string[] }[]",
            "isArray": true
          }
        ],

  /* ------------------------------------------------------------------ *
   * Preferences that belong to the person looking, not to the project:
   * where they dragged a block, what colour they gave a bus, and any
   * code they typed but have not saved anywhere real. Kept per browser.
   * ------------------------------------------------------------------ */

  const store = {
    read(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch { return fallback; }
    },
    write(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private window, or storage off */ }
    },
  };

  const POSITIONS_KEY = "fragmentor.positions";
  const COLORS_KEY = "fragmentor.busColors";
  const DRAFTS_KEY = "fragmentor.codeDrafts";

  let positions = store.read(POSITIONS_KEY, {});
  let busColors = store.read(COLORS_KEY, {});
  let drafts = store.read(DRAFTS_KEY, {});

  const BUS_PALETTE = ["#4fe38f", "#4fc9e3", "#e2a54b", "#b98ce6", "#e3778c", "#8fe34f"];

  let active = 0;
  let blocks = PROJECTS[0].blocks;

  const ui = {
    view: PROJECTS[0].rootPath,
    selection: new Set(),
    selectedBus: null,
    zoom: 1,
    panX: 40,
    panY: 30,
    showRail: true,
    showInspector: true,
    codeTab: "impl",
    /** Once the view has been moved by hand, stop refitting it automatically. */
    userAdjusted: false,
  };

  const project = () => PROJECTS[active];
  const parentBlock = () => blocks[ui.view];
  const scopeKey = () => `${project().key}|${ui.view}`;

  /* ------------------------------------------------------------------ *
   * The graph as drawn. Every visible thing is a node, including the
   * boundary: the parent's own inputs are a source and its outputs are a
   * destination, so one set of rules covers the whole picture.
   * ------------------------------------------------------------------ */

  function wireEnds(wire) {
    return {
      source: wire.source.from === "input" ? "input" : wire.source.block,
      target: wire.target.to === "output" ? "output" : wire.target.block,
      sourcePort: wire.source.port,
      targetPort: wire.target.port,
      type: wire.type,
      isArray: wire.isArray,
      text: wire.text,
    };
  }

  function buildGraph() {
    const parent = parentBlock();
    if (!parent || parent.children.length === 0) return null;

    const wires = parent.wires.map(wireEnds);
    const nodes = new Map();

    nodes.set("input", {
      key: "input",
      label: "IN",
      sublabel: parent.name,
      boundary: true,
      outputs: parent.inputs,
      capabilities: [],
      child: null,
      block: null,
    });

    for (const child of parent.children) {
      const block = blocks[child.path];
      nodes.set(child.block, {
        key: child.block,
        label: block.name,
        sublabel: block.kind === "composite" ? "COMPOSITE" : "LEAF",
        boundary: false,
        outputs: block.outputs,
        capabilities: block.capabilities,
        child,
        block,
      });
    }

    nodes.set("output", {
      key: "output",
      label: "OUT",
      sublabel: parent.name,
      boundary: true,
      outputs: [],
      capabilities: [],
      child: null,
      block: null,
    });

    // Inputs are grouped by the bus that feeds them, which is what makes a
    // block's left edge readable: one bracket per upstream block.
    for (const node of nodes.values()) node.groups = [];

    for (const wire of wires) {
      const node = nodes.get(wire.target);
      if (!node) continue;
      let group = node.groups.find((g) => g.source === wire.source);
      if (!group) {
        group = { source: wire.source, signals: [] };
        node.groups.push(group);
      }
      group.signals.push(wire);
    }

    // One bus per source-and-destination pair, carrying every signal between them.
    const buses = new Map();
    for (const wire of wires) {
      const id = `${wire.source}->${wire.target}`;
      let bus = buses.get(id);
      if (!bus) {
        bus = { id, source: wire.source, target: wire.target, signals: [] };
        buses.set(id, bus);
      }
      bus.signals.push(wire);
    }

    return { parent, nodes, buses, wires };
  }

  function busColor(graph, bus) {
    const override = busColors[`${scopeKey()}|${bus.id}`];
    if (override) return override;
    const order = [...graph.nodes.keys()];
    return BUS_PALETTE[order.indexOf(bus.source) % BUS_PALETTE.length];
  }

  /* ------------------------------------------------------------------ *
   * Geometry
   * ------------------------------------------------------------------ */

  const NODE_W = 208;
  const HEAD_H = 34;
  const ROW_H = 17;
  const GROUP_HEAD_H = 14;
  const GROUP_GAP = 7;
  const BODY_PAD = 9;
  const COL_GAP = 92;
  const ROW_GAP = 40;

  function measure(node) {
    let left = 0;
    for (const group of node.groups) left += GROUP_HEAD_H + group.signals.length * ROW_H + GROUP_GAP;
    if (left > 0) left -= GROUP_GAP;

    const right = node.outputs.length > 0 ? GROUP_HEAD_H + node.outputs.length * ROW_H : 0;
    const body = Math.max(left, right, ROW_H);
    return {
      leftHeight: left,
      rightHeight: right,
      height: HEAD_H + BODY_PAD + body + BODY_PAD + (node.capabilities.length > 0 ? 20 : 0),
    };
  }

  /** Columns by dependency, so an untouched diagram still reads left to right. */
  function autoLayout(graph) {
    const depth = new Map([["input", 0]]);
    const parent = graph.parent;

    for (const id of parent.order) {
      let d = 1;
      for (const wire of graph.wires) {
        if (wire.target !== id || wire.source === "input") continue;
        d = Math.max(d, (depth.get(wire.source) ?? 1) + 1);
      }
      depth.set(id, d);
    }

    const deepest = Math.max(0, ...[...depth.values()]);
    depth.set("output", deepest + 1);

    const columns = new Map();
    for (const node of graph.nodes.values()) {
      const d = depth.get(node.key) ?? 0;
      if (!columns.has(d)) columns.set(d, []);
      columns.get(d).push(node);
    }

    const placed = new Map();
    let tallest = 0;
    for (const column of columns.values()) {
      const total = column.reduce((h, n) => h + measure(n).height, 0) + ROW_GAP * (column.length - 1);
      tallest = Math.max(tallest, total);
    }

    for (const [d, column] of [...columns.entries()].sort((a, b) => a[0] - b[0])) {
      const total = column.reduce((h, n) => h + measure(n).height, 0) + ROW_GAP * (column.length - 1);
      let y = (tallest - total) / 2;
      for (const node of column) {
        placed.set(node.key, { x: d * (NODE_W + COL_GAP), y });
        y += measure(node).height + ROW_GAP;
      }
    }

    return placed;
  }

  function layoutFor(graph) {
    const auto = autoLayout(graph);
    const saved = positions[scopeKey()] ?? {};
    const result = new Map();
    for (const node of graph.nodes.values()) {
      const stored = saved[node.key];
      result.set(node.key, stored ? { ...stored } : auto.get(node.key));
    }
    return result;
  }

  function savePositions(layout) {
    const scoped = {};
    for (const [key, point] of layout) scoped[key] = { x: Math.round(point.x), y: Math.round(point.y) };
    positions = { ...positions, [scopeKey()]: scoped };
    store.write(POSITIONS_KEY, positions);
  }

  /** Where a bus leaves a node: one dot for everything the node produces. */
  function busOutPoint(node, point) {
    const { rightHeight } = measure(node);
    const top = point.y + HEAD_H + BODY_PAD;
    return { x: point.x + NODE_W, y: top + (rightHeight > 0 ? rightHeight / 2 : ROW_H / 2) };
  }

  /** Where a bus lands: the middle of the group it feeds. */
  function busInPoint(node, point, sourceKey) {
    let y = point.y + HEAD_H + BODY_PAD;
    for (const group of node.groups) {
      const height = GROUP_HEAD_H + group.signals.length * ROW_H;
      if (group.source === sourceKey) return { x: point.x, y: y + height / 2 };
      y += height + GROUP_GAP;
    }
    return { x: point.x, y: point.y + HEAD_H + BODY_PAD };
  }

  function svgEl(name, attrs, parent) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, String(value));
    if (parent) parent.append(node);
    return node;
  }

  function curve(a, b) {
    const dx = Math.max(40, Math.abs(b.x - a.x) * 0.5);
    return `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`;
  }

  /* ------------------------------------------------------------------ *
   * The code a wire corresponds to. Composite glue is not written yet,
   * so this is the call and binding the diagram implies, not a reading
   * of a file. It is generated the same way for every bus so the shape
   * is honest even before the code exists.
   * ------------------------------------------------------------------ */

  /** `port` when the names already agree, `port: source` when they do not. */
  function argFor(signal) {
    return signal.sourcePort === signal.targetPort
      ? signal.targetPort
      : `${signal.targetPort}: ${signal.sourcePort}`;
  }

  function signalsOf(node) {
    return node.groups.flatMap((g) => g.signals);
  }

  function callStatement(graph, nodeKey) {
    if (nodeKey === "input") return null;

    if (nodeKey === "output") {
      const node = graph.nodes.get("output");
      return `return { ${signalsOf(node).map(argFor).join(", ")} };`;
    }

    const node = graph.nodes.get(nodeKey);
    if (!node || !node.block) return null;

    const fn = node.block.functionName;
    const produced = node.outputs.map((o) => o.name);
    const signals = signalsOf(node);

    if (node.child && node.child.mode === "each") {
      const item = node.child.eachOver;
      const over = signals.find((s) => s.targetPort === item);
      const arrayVar = over ? over.sourcePort : `${item}s`;
      const rest = signals.filter((s) => s.targetPort !== item).map(argFor);
      const inner = [item, ...rest].join(", ");
      const results = `${fn}Results`;

      return [
        `const ${results} = await Promise.all(`,
        `  ${arrayVar}.map((${item}) => ${fn}({ ${inner} }, caps)),`,
        `);`,
        ...produced.map((name) => `const ${name} = ${results}.map((r) => r.${name});`),
      ].join("\n");
    }

    const binding = produced.length > 0 ? `const { ${produced.join(", ")} } = ` : "";
    return `${binding}await ${fn}({ ${signals.map(argFor).join(", ")} }, caps);`;
  }

  function connectionCode(graph, bus) {
    const lines = [];
    const sourceNode = graph.nodes.get(bus.source);
    const targetNode = graph.nodes.get(bus.target);

    if (bus.source === "input") {
      lines.push(`// ${graph.parent.name} receives these as its own arguments`);
      lines.push(`const { ${bus.signals.map((s) => s.sourcePort).join(", ")} } = input;`);
    } else {
      lines.push(`// produced by ${sourceNode.label}`);
      lines.push(callStatement(graph, bus.source));
    }

    lines.push("");
    if (bus.target === "output") {
      lines.push(`// returned by ${graph.parent.name}`);
    } else {
      lines.push(`// consumed by ${targetNode.label}`);
    }
    lines.push(callStatement(graph, bus.target));

    return lines.join("\n");
  }

  /* ------------------------------------------------------------------ *
   * Drawing
   * ------------------------------------------------------------------ */

  let currentGraph = null;
  let currentLayout = null;

  function applyViewport() {
    document.getElementById("viewport")
      .setAttribute("transform", `translate(${ui.panX} ${ui.panY}) scale(${ui.zoom})`);
    document.getElementById("zoom-level").textContent = `${Math.round(ui.zoom * 100)}%`;
  }

  function renderCanvas() {
    const busLayer = document.getElementById("bus-layer");
    const nodeLayer = document.getElementById("node-layer");
    busLayer.replaceChildren();
    nodeLayer.replaceChildren();

    document.querySelectorAll(".canvas-empty").forEach((el) => el.remove());

    const graph = buildGraph();
    currentGraph = graph;

    if (!graph) {
      const note = document.createElement("p");
      note.className = "canvas-empty";
      const parent = parentBlock();
      note.textContent = `${parent.name} is a leaf block.\nIts behaviour is code, not a diagram — the inspector shows its contract and source.`;
      document.getElementById("canvas-wrap").append(note);
      return;
    }

    const layout = layoutFor(graph);
    currentLayout = layout;

    for (const bus of graph.buses.values()) {
      const sourceNode = graph.nodes.get(bus.source);
      const targetNode = graph.nodes.get(bus.target);
      const from = busOutPoint(sourceNode, layout.get(bus.source));
      const to = busInPoint(targetNode, layout.get(bus.target), bus.source);
      const colour = busColor(graph, bus);

      const linked = ui.selection.has(bus.source) && ui.selection.has(bus.target);
      const group = svgEl("g", {
        class: "bus-group",
        "data-selected": String(ui.selectedBus === bus.id),
        "data-linked": String(linked),
      }, busLayer);

      const path = curve(from, to);
      svgEl("path", { d: path, class: "bus", stroke: colour }, group);
      const hit = svgEl("path", { d: path, class: "bus-hit" }, group);
      svgEl("title", {}, group).textContent =
        `${bus.source} → ${bus.target}\n${bus.signals.map((s) => `${s.targetPort}: ${s.type}`).join("\n")}`;

      const mid = { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 - 6 };
      const label = svgEl("text", { x: mid.x, y: mid.y, class: "bus-count", "text-anchor": "middle", fill: colour }, group);
      label.textContent = bus.signals.length === 1 ? bus.signals[0].targetPort : `${bus.signals.length} signals`;

      hit.addEventListener("click", (event) => {
        event.stopPropagation();
        ui.selectedBus = bus.id;
        ui.selection.clear();
        render();
      });
    }

    for (const node of graph.nodes.values()) {
      const point = layout.get(node.key);
      const { height, rightHeight } = measure(node);
      const selected = ui.selection.has(node.key);

      const group = svgEl("g", {
        class: "block-box",
        transform: `translate(${point.x} ${point.y})`,
        "data-selected": String(selected),
        "data-boundary": String(node.boundary),
        "data-key": node.key,
        tabindex: "0",
        role: "button",
      }, nodeLayer);

      svgEl("title", {}, group).textContent = node.block
        ? node.block.responsibility + (node.block.kind === "composite" ? "\n\nDouble-click to open this block's diagram." : "")
        : `${node.label} of ${graph.parent.name}`;

      svgEl("rect", { x: 0, y: 0, width: NODE_W, height, rx: 3, class: "block-plate" }, group);
      svgEl("rect", { x: 0, y: 0, width: NODE_W, height: HEAD_H, rx: 3, class: "block-head" }, group);
      svgEl("line", { x1: 0, y1: HEAD_H, x2: NODE_W, y2: HEAD_H, class: "block-divider" }, group);
      svgEl("text", { x: 10, y: 15, class: "block-name" }, group).textContent = node.label;
      svgEl("text", { x: 10, y: 27, class: "block-kind" }, group).textContent = node.sublabel;

      if (node.child && node.child.mode === "each") {
        svgEl("text", { x: NODE_W - 10, y: 15, class: "each-badge", "text-anchor": "end" }, group)
          .textContent = `× each ${node.child.eachOver}`;
      }

      // Left edge: one bracket per incoming bus, with its signals inside it.
      let y = HEAD_H + BODY_PAD;
      for (const busGroup of node.groups) {
        const bus = graph.buses.get(`${busGroup.source}->${node.key}`);
        const colour = bus ? busColor(graph, bus) : "var(--signal-dim)";
        const groupHeight = GROUP_HEAD_H + busGroup.signals.length * ROW_H;
        const sourceLabel = graph.nodes.get(busGroup.source)?.label ?? busGroup.source;

        svgEl("path", {
          d: `M 6 ${y + 2} L 1 ${y + 2} L 1 ${y + groupHeight - 2} L 6 ${y + groupHeight - 2}`,
          class: "group-bracket",
          stroke: colour,
        }, group);

        svgEl("circle", { cx: 0, cy: y + groupHeight / 2, r: 3.5, class: "bus-dot", fill: "var(--panel)", stroke: colour }, group);

        const heading = svgEl("text", { x: 11, y: y + 10, class: "group-label", fill: colour }, group);
        heading.textContent = `from ${sourceLabel}`;

        busGroup.signals.forEach((signal, i) => {
          svgEl("text", { x: 15, y: y + GROUP_HEAD_H + i * ROW_H + 11, class: "port-label" }, group)
            .textContent = signal.targetPort;
        });

        y += groupHeight + GROUP_GAP;
      }

      // Right edge: everything the block produces leaves on one bus.
      if (node.outputs.length > 0) {
        const top = HEAD_H + BODY_PAD;
        svgEl("text", { x: NODE_W - 15, y: top + 10, class: "bus-out-label", "text-anchor": "end" }, group)
          .textContent = "bus out";
        node.outputs.forEach((port, i) => {
          svgEl("text", { x: NODE_W - 15, y: top + GROUP_HEAD_H + i * ROW_H + 11, class: "port-label", "text-anchor": "end" }, group)
            .textContent = port.name;
        });
        svgEl("circle", {
          cx: NODE_W,
          cy: top + rightHeight / 2,
          r: 4,
          class: "bus-dot",
          fill: "var(--panel)",
          stroke: "var(--signal-dim)",
        }, group);
      }

      node.capabilities.forEach((cap, i) => {
        const cx = 26 + i * 58;
        svgEl("line", { x1: cx, y1: height, x2: cx, y2: height + 11, class: "cap-line" }, group);
        svgEl("circle", { cx, cy: height + 14, r: 3.5, class: "cap-dot" }, group);
        svgEl("text", { x: cx + 8, y: height + 17.5, class: "port-label" }, group).textContent = cap.name;
      });

      attachNodeBehaviour(group, node);
    }

    applyViewport();
  }

  /* ------------------------------------------------------------------ *
   * Selection, dragging, panning, zooming
   * ------------------------------------------------------------------ */

  let drag = null;

  function attachNodeBehaviour(group, node) {
    group.addEventListener("pointerdown", (event) => {
      event.stopPropagation();
      const additive = event.ctrlKey || event.metaKey;

      if (additive) {
        if (ui.selection.has(node.key)) ui.selection.delete(node.key);
        else ui.selection.add(node.key);
        ui.selectedBus = null;
        render();
        return;
      }

      if (!ui.selection.has(node.key)) {
        ui.selection.clear();
        ui.selection.add(node.key);
        ui.selectedBus = null;
        render();
      }

      drag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        moved: false,
        origin: new Map([...ui.selection].map((key) => [key, { ...currentLayout.get(key) }])),
      };
      document.getElementById("canvas-svg").classList.add("dragging");
      group.setPointerCapture(event.pointerId);
    });

    group.addEventListener("pointermove", (event) => {
      if (!drag || drag.pointerId !== event.pointerId) return;
      const dx = (event.clientX - drag.startX) / ui.zoom;
      const dy = (event.clientY - drag.startY) / ui.zoom;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) drag.moved = true;

      for (const [key, origin] of drag.origin) {
        currentLayout.set(key, { x: origin.x + dx, y: origin.y + dy });
      }
      renderCanvas();
    });

    const finish = (event) => {
      if (!drag || drag.pointerId !== event.pointerId) return;
      document.getElementById("canvas-svg").classList.remove("dragging");
      if (drag.moved) {
        ui.userAdjusted = true;
        savePositions(currentLayout);
      }
      drag = null;
      render();
    };

    group.addEventListener("pointerup", finish);
    group.addEventListener("pointercancel", finish);

    group.addEventListener("dblclick", (event) => {
      event.stopPropagation();
      if (node.block && node.block.kind === "composite") openBlock(node.block.path);
    });

    group.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      ui.selection.clear();
      ui.selection.add(node.key);
      ui.selectedBus = null;
      render();
    });
  }

  function setUpCanvasGestures() {
    const svg = document.getElementById("canvas-svg");
    let pan = null;

    svg.addEventListener("pointerdown", (event) => {
      if (event.target.closest(".block-box") || event.target.closest(".bus-group")) return;
      pan = { x: event.clientX, y: event.clientY, panX: ui.panX, panY: ui.panY, moved: false };
      svg.classList.add("panning");
      svg.setPointerCapture(event.pointerId);
    });

    svg.addEventListener("pointermove", (event) => {
      if (!pan) return;
      ui.panX = pan.panX + (event.clientX - pan.x);
      ui.panY = pan.panY + (event.clientY - pan.y);
      if (Math.abs(event.clientX - pan.x) > 2 || Math.abs(event.clientY - pan.y) > 2) {
        pan.moved = true;
        ui.userAdjusted = true;
      }
      applyViewport();
    });

    const endPan = (event) => {
      if (!pan) return;
      svg.classList.remove("panning");
      const clicked = !pan.moved;
      pan = null;
      if (clicked) {
        ui.selection.clear();
        ui.selectedBus = null;
        render();
      }
      void event;
    };

    svg.addEventListener("pointerup", endPan);
    svg.addEventListener("pointercancel", endPan);

    svg.addEventListener("wheel", (event) => {
      event.preventDefault();
      const rect = svg.getBoundingClientRect();
      const px = event.clientX - rect.left;
      const py = event.clientY - rect.top;
      const factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
      zoomAbout(px, py, factor);
    }, { passive: false });
  }

  function zoomAbout(px, py, factor) {
    const next = Math.min(3, Math.max(0.25, ui.zoom * factor));
    const scale = next / ui.zoom;
    ui.panX = px - (px - ui.panX) * scale;
    ui.panY = py - (py - ui.panY) * scale;
    ui.zoom = next;
    ui.userAdjusted = true;
    applyViewport();
  }

  /** The canvas has no size until layout settles, so keep asking. */
  function fitWhenReady(attempts) {
    const rect = document.getElementById("canvas-svg").getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) { fitToView(); return; }
    if (attempts > 0) requestAnimationFrame(() => fitWhenReady(attempts - 1));
  }

  function fitToView() {
    if (!currentGraph || !currentLayout) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

    for (const node of currentGraph.nodes.values()) {
      const point = currentLayout.get(node.key);
      const { height } = measure(node);
      minX = Math.min(minX, point.x - 30);
      minY = Math.min(minY, point.y - 20);
      maxX = Math.max(maxX, point.x + NODE_W + 30);
      maxY = Math.max(maxY, point.y + height + 34);
    }

    const svg = document.getElementById("canvas-svg").getBoundingClientRect();
    if (!svg.width || !svg.height) return;

    const zoom = Math.min(3, Math.max(0.25, Math.min(svg.width / (maxX - minX), svg.height / (maxY - minY))));
    ui.zoom = zoom;
    ui.panX = (svg.width - (maxX - minX) * zoom) / 2 - minX * zoom;
    ui.panY = (svg.height - (maxY - minY) * zoom) / 2 - minY * zoom;
    applyViewport();
  }

  function openBlock(path) {
    ui.view = path;
    ui.selection.clear();
    ui.selectedBus = null;
    ui.userAdjusted = false;
    render();
    fitWhenReady(20);
  }

  /* ------------------------------------------------------------------ *
   * Panels
   * ------------------------------------------------------------------ */

  function renderPanes() {
    const columns = [];
    if (ui.showRail) columns.push("232px");
    columns.push("minmax(0, 1fr)");
    if (ui.showInspector) columns.push("360px");

    document.getElementById("panes").style.gridTemplateColumns = columns.join(" ");
    document.getElementById("rail").hidden = !ui.showRail;
    document.getElementById("inspector-pane").hidden = !ui.showInspector;
    document.getElementById("toggle-rail").setAttribute("aria-pressed", String(ui.showRail));
    document.getElementById("toggle-inspector").setAttribute("aria-pressed", String(ui.showInspector));
  }

  function renderProjectTabs() {
    const nav = document.getElementById("project-tabs");
    nav.replaceChildren();
    PROJECTS.forEach((entry, index) => {
      const tab = document.createElement("button");
      tab.className = "tab";
      tab.textContent = entry.label;
      tab.setAttribute("aria-pressed", String(index === active));
      tab.title = entry.manifest.goal;
      tab.addEventListener("click", () => {
        active = index;
        blocks = entry.blocks;
        ui.view = entry.rootPath;
        ui.selection.clear();
        ui.selectedBus = null;
        ui.userAdjusted = false;
        renderProjectTabs();
        renderStatus();
        render();
        fitWhenReady(20);
      });
      nav.append(tab);
    });
  }

  function renderCrumbs() {
    const nav = document.getElementById("crumbs");
    nav.replaceChildren();
    const parts = ui.view.split("/");

    parts.forEach((part, i) => {
      if (i > 0) {
        const sep = document.createElement("span");
        sep.className = "crumb-sep";
        sep.textContent = "/";
        nav.append(sep);
      }
      const path = parts.slice(0, i + 1).join("/");
      const button = document.createElement("button");
      button.className = "crumb";
      button.textContent = part;
      const isCurrent = i === parts.length - 1;
      button.setAttribute("aria-current", String(isCurrent));
      if (!isCurrent) button.addEventListener("click", () => openBlock(path));
      nav.append(button);
    });
  }

  function renderTree() {
    const tree = document.getElementById("tree");
    tree.replaceChildren();

    const walk = (path, depth) => {
      const block = blocks[path];
      const button = document.createElement("button");
      button.className = "node";
      button.setAttribute("role", "treeitem");
      button.setAttribute("aria-selected", String(path === ui.view));
      button.style.paddingLeft = `${8 + depth * 14}px`;

      const glyph = document.createElement("span");
      glyph.className = "glyph";
      glyph.textContent = block.kind === "composite" ? "▣" : "▫";
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = block.id;
      button.append(glyph, label);

      button.addEventListener("click", () => {
        if (block.kind === "composite") {
          openBlock(path);
        } else {
          const parent = path.split("/").slice(0, -1).join("/") || project().rootPath;
          ui.view = parent;
          ui.selection.clear();
          ui.selection.add(block.id);
          ui.selectedBus = null;
          render();
        }
      });

      tree.append(button);
      for (const child of block.children) walk(child.path, depth + 1);
    };

    walk(project().rootPath, 0);
  }

  function portSection(title, ports, isCapability) {
    const section = document.createElement("section");
    section.className = "section";
    const heading = document.createElement("h3");
    heading.textContent = title;
    section.append(heading);

    if (ports.length === 0) {
      const none = document.createElement("p");
      none.className = "bench-note";
      none.textContent = "None.";
      section.append(none);
      return section;
    }

    const list = document.createElement("div");
    list.className = "ports";
    for (const port of ports) {
      const row = document.createElement("div");
      row.className = `port-row${isCapability ? " cap" : ""}`;
      const name = document.createElement("div");
      name.className = "pname";
      name.textContent = port.name;
      const type = document.createElement("div");
      type.className = "ptype";
      type.textContent = isCapability ? port.capability : port.type;
      row.append(name, type);
      if (port.description) {
        const desc = document.createElement("div");
        desc.className = "pdesc";
        desc.textContent = port.description;
        row.append(desc);
      }
      list.append(row);
    }
    section.append(list);
    return section;
  }

  function codeSection(block) {
    const section = document.createElement("section");
    section.className = "section";
    const heading = document.createElement("h3");
    heading.textContent = "Code";
    section.append(heading);

    const tabs = document.createElement("div");
    tabs.className = "code-tabs";
    for (const [key, label] of [["impl", "impl.ts"], ["contract", "contract.ts"]]) {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = label;
      chip.setAttribute("aria-pressed", String(ui.codeTab === key));
      chip.addEventListener("click", () => { ui.codeTab = key; renderInspector(); });
      tabs.append(chip);
    }
    section.append(tabs);

    const generated = block.sources ? block.sources[ui.codeTab] : null;
    const draftKey = `${project().key}|${block.path}|${ui.codeTab}`;
    const isContract = ui.codeTab === "contract";
    const value = isContract ? generated : (drafts[draftKey] ?? generated);

    if (value === null || value === undefined) {
      const none = document.createElement("p");
      none.className = "bench-note";
      none.textContent = "This file has not been generated yet.";
      section.append(none);
      return section;
    }

    const editor = document.createElement("textarea");
    editor.className = "code-editor";
    editor.spellcheck = false;
    editor.value = value;
    if (isContract) editor.readOnly = true;
    section.append(editor);

    const foot = document.createElement("div");
    foot.className = "code-foot";

    if (isContract) {
      const note = document.createElement("p");
      note.className = "bench-note";
      note.textContent = "Generated from block.json, so it is read-only here. Change the diagram and it is rewritten.";
      foot.append(note);
    } else {
      const save = document.createElement("button");
      save.className = "btn";
      save.textContent = "Keep edit";
      save.addEventListener("click", () => {
        drafts = { ...drafts, [draftKey]: editor.value };
        store.write(DRAFTS_KEY, drafts);
        renderInspector();
      });

      const revert = document.createElement("button");
      revert.className = "btn quiet";
      revert.textContent = "Revert";
      revert.addEventListener("click", () => {
        const next = { ...drafts };
        delete next[draftKey];
        drafts = next;
        store.write(DRAFTS_KEY, drafts);
        renderInspector();
      });

      const note = document.createElement("p");
      note.className = "bench-note";
      note.textContent = drafts[draftKey]
        ? "Edited in this browser only. Nothing has been written to the file on disk."
        : "Edits are kept in this browser only; this prototype cannot write to disk.";

      foot.append(save, revert, note);
    }

    section.append(foot);
    return section;
  }

  function benchSection(block) {
    const bench = document.createElement("section");
    bench.className = "section bench";
    const heading = document.createElement("h3");
    heading.textContent = "Test bench";
    bench.append(heading);

    const note = document.createElement("p");
    note.className = "bench-note";
    note.textContent =
      "Built from the port types above. The values are examples, and no implementation exists yet, so nothing can run.";
    bench.append(note);

    for (const port of block.inputs) bench.append(controlFor(port.typeIr, port.name));

    const run = document.createElement("button");
    run.className = "btn";
    run.textContent = "Run block";
    run.disabled = true;
    run.title = "This block has no implementation yet.";
    bench.append(run);
    return bench;
  }

  function exampleFor(type, name) {
    switch (type.kind) {
      case "string": return name && /path/i.test(name) ? "./postings.json" : "example";
      case "number": return 0;
      case "boolean": return false;
      case "null": case "unknown": return null;
      case "literal": return type.value;
      case "enum": return type.values[0];
      case "array": return [exampleFor(type.of, name)];
      case "union": return exampleFor(type.of[0], name);
      case "object": {
        const out = {};
        for (const [field, spec] of Object.entries(type.fields)) if (!spec.optional) out[field] = exampleFor(spec.type, field);
        return out;
      }
      default: return null;
    }
  }

  function field(labelText, control) {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const label = document.createElement("label");
    label.textContent = labelText;
    wrap.append(label, control);
    return wrap;
  }

  function controlFor(type, name) {
    if (type.kind === "object") {
      const group = document.createElement("div");
      group.className = "subfields";
      for (const [fieldName, spec] of Object.entries(type.fields)) {
        group.append(controlFor(spec.type, fieldName + (spec.optional ? "?" : "")));
      }
      return field(name, group);
    }

    if (type.kind === "array") {
      const area = document.createElement("textarea");
      area.value = JSON.stringify(exampleFor(type, name), null, 1);
      area.spellcheck = false;
      return field(name, area);
    }

    if (type.kind === "boolean") {
      const box = document.createElement("input");
      box.type = "checkbox";
      return field(name, box);
    }

    if (type.kind === "enum") {
      const select = document.createElement("select");
      for (const value of type.values) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.append(option);
      }
      return field(name, select);
    }

    const input = document.createElement("input");
    input.type = type.kind === "number" ? "number" : "text";
    const sample = exampleFor(type, name);
    input.value = sample === null ? "" : String(sample);
    return field(name, input);
  }

  function renderBusInspector(panel, graph, bus) {
    const sourceLabel = graph.nodes.get(bus.source)?.label ?? bus.source;
    const targetLabel = graph.nodes.get(bus.target)?.label ?? bus.target;

    const head = document.createElement("div");
    head.className = "insp-head";
    const title = document.createElement("h2");
    title.textContent = `${sourceLabel} → ${targetLabel}`;
    const id = document.createElement("div");
    id.className = "insp-id";
    id.textContent = `${bus.signals.length} signal${bus.signals.length === 1 ? "" : "s"} on one bus`;
    head.append(title, id);
    panel.append(head);

    const signals = document.createElement("section");
    signals.className = "section";
    const signalsHeading = document.createElement("h3");
    signalsHeading.textContent = "Carries";
    signals.append(signalsHeading);

    const list = document.createElement("div");
    list.className = "ports";
    for (const signal of bus.signals) {
      const row = document.createElement("div");
      row.className = "port-row";
      const name = document.createElement("div");
      name.className = "pname";
      name.textContent = `${signal.sourcePort} → ${signal.targetPort}`;
      const type = document.createElement("div");
      type.className = "ptype";
      type.textContent = signal.type ?? "unknown";
      row.append(name, type);
      list.append(row);
    }
    signals.append(list);
    panel.append(signals);

    const code = document.createElement("section");
    code.className = "section";
    const codeHeading = document.createElement("h3");
    codeHeading.textContent = "In code";
    code.append(codeHeading);

    const pre = document.createElement("pre");
    pre.className = "code";
    pre.textContent = connectionCode(graph, bus);
    code.append(pre);

    const note = document.createElement("p");
    note.className = "bench-note";
    note.style.marginTop = "8px";
    note.textContent =
      "The call and binding this connection becomes. The composite's glue is not written yet, so this is derived from the diagram rather than read from the file.";
    code.append(note);
    panel.append(code);

    const colours = document.createElement("section");
    colours.className = "section";
    const colourHeading = document.createElement("h3");
    colourHeading.textContent = "Colour";
    colours.append(colourHeading);

    const swatches = document.createElement("div");
    swatches.className = "swatches";
    const key = `${scopeKey()}|${bus.id}`;
    const currentColour = busColor(graph, bus);

    for (const colour of BUS_PALETTE) {
      const swatch = document.createElement("button");
      swatch.className = "swatch-btn";
      swatch.style.background = colour;
      swatch.title = colour;
      swatch.setAttribute("aria-pressed", String(colour.toLowerCase() === currentColour.toLowerCase()));
      swatch.addEventListener("click", () => {
        busColors = { ...busColors, [key]: colour };
        store.write(COLORS_KEY, busColors);
        render();
      });
      swatches.append(swatch);
    }
    colours.append(swatches);

    const reset = document.createElement("button");
    reset.className = "btn quiet";
    reset.style.marginTop = "8px";
    reset.textContent = "Use the default colour";
    reset.addEventListener("click", () => {
      const next = { ...busColors };
      delete next[key];
      busColors = next;
      store.write(COLORS_KEY, busColors);
      render();
    });
    colours.append(reset);
    panel.append(colours);
  }

  function renderMultiInspector(panel, graph) {
    const keys = [...ui.selection];
    const head = document.createElement("div");
    head.className = "insp-head";
    const title = document.createElement("h2");
    title.textContent = `${keys.length} blocks selected`;
    const id = document.createElement("div");
    id.className = "insp-id";
    id.textContent = keys.join(", ");
    head.append(title, id);
    panel.append(head);

    const between = [...graph.buses.values()].filter((b) => ui.selection.has(b.source) && ui.selection.has(b.target));

    const section = document.createElement("section");
    section.className = "section";
    const heading = document.createElement("h3");
    heading.textContent = "Buses between them";
    section.append(heading);

    if (between.length === 0) {
      const none = document.createElement("p");
      none.className = "bench-note";
      none.textContent = "These blocks are not directly connected.";
      section.append(none);
    } else {
      const list = document.createElement("div");
      list.className = "ports";
      for (const bus of between) {
        const row = document.createElement("div");
        row.className = "port-row";
        row.style.borderLeftColor = busColor(graph, bus);
        const name = document.createElement("div");
        name.className = "pname";
        name.textContent = `${graph.nodes.get(bus.source).label} → ${graph.nodes.get(bus.target).label}`;
        const type = document.createElement("div");
        type.className = "ptype";
        type.textContent = bus.signals.map((s) => s.targetPort).join(", ");
        row.append(name, type);
        list.append(row);
      }
      section.append(list);
    }

    panel.append(section);

    const note = document.createElement("p");
    note.className = "bench-note";
    note.textContent = "Ctrl-click a block to add or remove it from the selection.";
    panel.append(note);
  }

  function renderBlockInspector(panel, block) {
    const head = document.createElement("div");
    head.className = "insp-head";
    const title = document.createElement("h2");
    title.textContent = block.name;
    const id = document.createElement("div");
    id.className = "insp-id";
    id.textContent = block.path;

    const badges = document.createElement("div");
    badges.className = "badges";
    const kind = document.createElement("span");
    kind.className = `badge${block.kind === "composite" ? " composite" : ""}`;
    kind.textContent = block.kind;
    const status = document.createElement("span");
    status.className = "badge state";
    status.textContent = "specified";
    badges.append(kind, status);
    head.append(title, id, badges);

    if (block.kind === "composite" && block.path !== ui.view) {
      const open = document.createElement("button");
      open.className = "btn";
      open.textContent = "Open diagram";
      open.addEventListener("click", () => openBlock(block.path));
      head.append(open);
    }
    panel.append(head);

    const responsibility = document.createElement("p");
    responsibility.className = "responsibility";
    responsibility.textContent = block.responsibility;
    panel.append(responsibility);

    panel.append(portSection("Inputs", block.inputs, false));
    panel.append(portSection("Outputs", block.outputs, false));
    panel.append(portSection("Capabilities", block.capabilities, true));
    panel.append(codeSection(block));
    panel.append(benchSection(block));
  }

  function renderInspector() {
    const panel = document.getElementById("inspector");
    panel.replaceChildren();
    const graph = currentGraph;

    if (graph && ui.selectedBus && graph.buses.has(ui.selectedBus)) {
      renderBusInspector(panel, graph, graph.buses.get(ui.selectedBus));
      return;
    }

    if (graph && ui.selection.size > 1) {
      renderMultiInspector(panel, graph);
      return;
    }

    if (ui.selection.size === 1 && graph) {
      const key = [...ui.selection][0];
      const node = graph.nodes.get(key);
      if (node && node.block) {
        renderBlockInspector(panel, node.block);
        return;
      }
    }

    renderBlockInspector(panel, parentBlock());
  }

  function renderStatus() {
    const all = Object.values(blocks);
    const composites = all.filter((b) => b.kind === "composite").length;
    const graph = currentGraph;
    const busCount = graph ? graph.buses.size : 0;
    const signalCount = graph ? graph.wires.length : 0;

    document.getElementById("status").innerHTML =
      `<span>blocks <b>${all.length}</b></span>` +
      `<span>composite <b>${composites}</b></span>` +
      `<span>leaf <b>${all.length - composites}</b></span>` +
      `<span>in view: <b>${busCount}</b> buses carrying <b>${signalCount}</b> signals</span>` +
      `<span class="warn">implemented <b>0</b></span>` +
      `<span class="warn">tests passing <b>0</b></span>` +
      `<span>granularity <b>${project().manifest.granularity.level}</b> of 5</span>`;
  }

  function render() {
    renderPanes();
    renderCrumbs();
    renderTree();
    renderCanvas();
    renderInspector();
    renderStatus();
  }

  function reportFailure(error) {
    const wrap = document.getElementById("canvas-wrap");
    if (!wrap) return;
    const note = document.createElement("pre");
    note.className = "canvas-empty";
    note.textContent = "The canvas could not be drawn.\n\n" + (error && error.stack ? error.stack : String(error));
    wrap.append(note);
  }

  try {
    document.getElementById("toggle-rail").addEventListener("click", () => {
      ui.showRail = !ui.showRail;
      renderPanes();
    });
    document.getElementById("toggle-inspector").addEventListener("click", () => {
      ui.showInspector = !ui.showInspector;
      renderPanes();
    });

    document.getElementById("zoom-in").addEventListener("click", () => {
      const rect = document.getElementById("canvas-svg").getBoundingClientRect();
      zoomAbout(rect.width / 2, rect.height / 2, 1.2);
    });
    document.getElementById("zoom-out").addEventListener("click", () => {
      const rect = document.getElementById("canvas-svg").getBoundingClientRect();
      zoomAbout(rect.width / 2, rect.height / 2, 1 / 1.2);
    });
    document.getElementById("zoom-fit").addEventListener("click", fitToView);
    document.getElementById("layout-reset").addEventListener("click", () => {
      const next = { ...positions };
      delete next[scopeKey()];
      positions = next;
      store.write(POSITIONS_KEY, positions);
      ui.userAdjusted = false;
      render();
      fitToView();
    });

    setUpCanvasGestures();

    if (typeof ResizeObserver === "function") {
      new ResizeObserver(() => { if (!ui.userAdjusted) fitToView(); })
        .observe(document.getElementById("canvas-wrap"));
    }

    renderProjectTabs();
    render();
    fitWhenReady(20);
  } catch (error) {
    reportFailure(error);
    throw error;
  }
</script>
